name: VOX-08I Staff EOD and Attention Web (Release HOLD)
on:
  pull_request:
    paths:
      - 'apps/vox-web/app/team/**'
      - 'apps/vox-web/app/api/eod-preview/**'
      - 'apps/vox-web/lib/core.ts'
      - 'apps/vox-web/lib/eod.ts'
      - 'apps/vox-web/lib/attention.ts'
      - 'apps/vox-web/scripts/validate-eod-attention-08i.spec.mjs'
      - 'apps/vox-web/package.json'
      - '.github/workflows/vox-to08i-staff-eod-web.yml'
permissions:
  contents: read
jobs:
  stage-locked-web-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/vox-web
      - run: npm test
        working-directory: apps/vox-web
      - run: npm run typecheck
        working-directory: apps/vox-web
      - run: npm run build
        working-directory: apps/vox-web
