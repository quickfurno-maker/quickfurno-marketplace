name: VOX AB5 Source Checkpoint and Private In-app Outbox - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/ab5-source-checkpoints/**'
      - 'services/vox/ab5InternalOutboxWorker.ts'
      - 'contracts/vox/ab5InternalOutboxBatch*'
      - 'scripts/mvp/vox/validate-voxAB5-*'
      - '.github/workflows/vox-ab5-eod-inapp-hold.yml'
permissions:
  contents: read
jobs:
  private-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
      - run: npm run build
