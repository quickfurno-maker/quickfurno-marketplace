name: VOX-L10 Automated Source Safety Gates (Release HOLD)
on:
  pull_request:
    paths:
      - 'contracts/vox/l10InternalCandidateGate.mjs'
      - 'scripts/mvp/vox/validate-voxL10-internal-gates.test.mjs'
      - 'docs/vox/VOX-L10-*'
      - '.github/workflows/vox-l10-continuous-release-hold.yml'
permissions:
  contents: read
jobs:
  never-deploy-safety-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-voxL10-internal-gates.test.mjs scripts/mvp/vox/validate-voxL5-independent-signed-review.test.mjs
