name: VOX TO-04E Combined Schema + Human Review HOLD
on:
  pull_request:
    paths:
      - 'ops/vox/certification/TO04C-LIVE-SCHEMA-EVIDENCE.json'
      - 'contracts/vox/firstTlAttestation.mjs'
      - 'scripts/mvp/vox/*to04c-schema*'
      - 'scripts/mvp/vox/*to04d-first-tl*'
      - 'scripts/mvp/vox/validate-to04e-review-gates.test.mjs'
      - '.github/workflows/vox-to04e-review-gates.yml'
permissions:
  contents: read
jobs:
  no-self-certified-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-to04c-schema-readiness.test.mjs scripts/mvp/vox/validate-to04d-first-tl-attestation.test.mjs scripts/mvp/vox/validate-to04e-review-gates.test.mjs
      - name: Release command must reject absent schema with exact exit 42
        shell: bash
        run: |
          set +e
          node scripts/mvp/vox/check-to04c-schema-readiness.mjs --release-check
          CODE=$?
          set -e
          test "$CODE" -eq 42
