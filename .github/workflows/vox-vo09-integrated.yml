name: VOX VO9 Staff Task Resume, Time History & Nonce Recovery — HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'contracts/vox/virtualOfficeTimeRead.*'
      - 'contracts/vox/virtualOfficeTimeHistory.*'
      - 'apps/vox-web/lib/staffTime.ts'
      - 'apps/vox-web/lib/staffTimeHistory.ts'
      - 'apps/vox-web/app/team/workday/**'
      - 'app/api/vox/v1/staff-time-history/**'
      - 'ops/vox/vo02-review-candidates/**'
      - 'scripts/mvp/vox/vo09-*'
      - 'scripts/mvp/vox/fixtures/vo08-cross-feature.pg17.sql'
      - '.github/workflows/vox-vo09-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staff-workday-and-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real contract and protected Workday regression
        run: |
          node --test \
            scripts/mvp/vox/vo09-task-resume.test.mjs \
            scripts/mvp/vox/vo09-task-history.test.mjs \
            scripts/mvp/vox/vo04-time-read.test.mjs \
            scripts/mvp/vox/vo04-staff-workday.test.mjs \
            scripts/mvp/vox/vo08-real-aal2-preflight.test.mjs \
            scripts/mvp/vox/vo01-virtual-office-meet-provider.test.mjs
      - name: Root TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: VOX Web locked dependencies
        working-directory: apps/vox-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full VOX Web regression tests
        working-directory: apps/vox-web
        run: npm test
      - name: Optimized VOX Web production build
        working-directory: apps/vox-web
        run: npm run build -- --webpack
  original-time-replay-real-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vox_disposable_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Canonical task DONE and exact original nonce replay
        run: bash scripts/mvp/vox/validate-vox-vo08-cross-feature-pg17.sh
