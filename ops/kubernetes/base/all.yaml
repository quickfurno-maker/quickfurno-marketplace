apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quickfurno
spec:
  ingressClassName: nginx
  tls:
    - hosts: [quickfurno.in, www.quickfurno.in]
      secretName: quickfurno-tls
  rules:
    - host: quickfurno.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quickfurno-web
                port: {number: 80}
    - host: www.quickfurno.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quickfurno-web
                port: {number: 80}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-https-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller-to-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: quickfurno
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 3000}
