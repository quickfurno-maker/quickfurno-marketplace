name: QF F10 Cross-Phase WhatsApp Security Recert (NO DEPLOY)

on:
  pull_request:
    paths:
      - "scripts/mvp/launch/verify-f10-cross-phase-whatsapp-recert.py"
      - "scripts/mvp/launch/test_f10_cross_phase_recert.py"
      - ".github/workflows/qf-f10-cross-phase-whatsapp-recert-no-deploy.yml"
      - "docs/launch/QF-F10-CROSS-PHASE-SECURITY-RECERT-20261106.md"

permissions:
  contents: read

jobs:
  certify-source-delta-without-waiving-history:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact immutable review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Verify unchanged F1 F5 F6 history and four exact new source hashes
        run: python3 scripts/mvp/launch/verify-f10-cross-phase-whatsapp-recert.py --repo .
      - name: Run 29 hostile F1 F5 F6 cross-phase mutation tests
        run: python3 -m unittest discover -s scripts/mvp/launch -p test_f10_cross_phase_recert.py -v
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run F9 F8 F7 F6 and returning-vendor tests
        run: node --import ./scripts/mvp/loader/register.mjs --test scripts/mvp/vendor/vendor-staging-readiness.test.mjs scripts/mvp/vendor/vendor-dual-waba-webhook-registry.test.mjs scripts/mvp/vendor/vendor-dedicated-otp-transport.test.mjs scripts/mvp/vendor/vendor-whatsapp-lane-isolation.test.mjs scripts/mvp/vendor/vendor-returning-login.test.mjs
      - name: Existing Jarvis WhatsApp agent and webhook safeguards
        run: node --import ./scripts/mvp/loader/register.mjs scripts/mvp/jarvis/validate-qf-whatsapp-jarvis-readiness.mjs
      - name: Full Marketplace TypeScript
        run: npm run typecheck
      - name: Full optimized Next.js build
        run: npm run build
      - name: Compiled localhost Owner readiness remains fail-closed
        run: node scripts/mvp/launch/smoke-f9-owner-whatsapp-no-send.mjs
      - name: Exact four-file F10 no-deploy diff
        run: python3 scripts/mvp/launch/verify-f10-cross-phase-whatsapp-recert.py --repo . --exact-git-diff
