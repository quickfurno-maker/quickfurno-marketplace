name: VOX AB5 Daily Report Source Checkpoints - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'apps/vox-web/lib/ab5SourceCheckpoint.ts'
      - 'apps/vox-web/app/team/daily-report/page.tsx'
      - 'apps/vox-web/scripts/validate-ab5-eod-sources.mjs'
      - '.github/workflows/vox-ab5-daily-web-hold.yml'
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    defaults:
      run:
        working-directory: apps/vox-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/validate-ab5-eod-sources.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
