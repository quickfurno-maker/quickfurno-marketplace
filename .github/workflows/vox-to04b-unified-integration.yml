name: VOX TO-04B Combined Core + Web Integration (Release HOLD)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/work-queue/**'
      - 'app/api/vox/v1/work-transitions/**'
      - 'app/api/vox/v1/staff-departments/**'
      - 'services/vox/verifiedScopedStaff.ts'
      - 'contracts/vox/**'
      - 'apps/vox-web/**'
      - 'ops/vox/sql-candidates/*'
      - 'ops/vox/certification/**'
      - 'scripts/mvp/vox/validate-to04b-unified-integration.test.mjs'
      - '.github/workflows/vox-to04b-unified-integration.yml'
permissions:
  contents: read
jobs:
  combined-auth-queue-client-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Cross-branch security contracts
        run: node --test scripts/mvp/vox/validate-to04b-unified-integration.test.mjs
      - name: Core + Reviewer + Queue + Riya + EOD source tests
        run: |
          node --test \
            scripts/mvp/vox/validate-to02e-effective-departments.test.mjs \
            scripts/mvp/vox/validate-to02f-reviewer-source.test.mjs \
            scripts/mvp/vox/validate-to02f-work-http.test.mjs \
            scripts/mvp/vox/validate-to02g-work-queue.test.mjs \
            scripts/mvp/vox/validate-to03b-riya-handover.test.mjs \
            scripts/mvp/vox/validate-to03c-core-work-eod.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Core TS compilation
        run: npm run typecheck
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/vox-web
      - name: VOX Web test, TypeScript and production build
        working-directory: apps/vox-web
        run: |
          npm test
          npm run typecheck
          npm run build
