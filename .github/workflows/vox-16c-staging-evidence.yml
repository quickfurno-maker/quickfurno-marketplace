name: VOX-16C private staging evidence gate
on:
  pull_request:
    paths:
      - 'scripts/mvp/vox/validate-vox16c-staging-evidence.mjs'
      - 'docs/vox/VOX-16C-STAGING-RELEASE-HOLD.md'
      - '.github/workflows/vox-16c-staging-evidence.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '20.20.2' }
      - run: |
          node scripts/mvp/vox/validate-vox16c-staging-evidence.mjs
          ! node scripts/mvp/vox/validate-vox16c-staging-evidence.mjs --authorize
          node scripts/mvp/vox/validate-vox15-staging-preflight.mjs
