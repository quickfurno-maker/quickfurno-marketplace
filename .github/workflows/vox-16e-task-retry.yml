name: VOX-16E staff vendor task idempotent retry
on:
  pull_request:
    paths:
      - 'apps/vox-web/app/vendor360/components/TaskCreator.tsx'
      - 'scripts/mvp/vox/validate-vox16e-task-retry.mjs'
      - '.github/workflows/vox-16e-task-retry.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  no-duplicate-after-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: '20.20.2'}
      - run: |
          node scripts/mvp/vox/validate-vox16e-task-retry.mjs
          node scripts/mvp/vox/validate-vox16-task-idempotency.mjs
      - run: |
          cd apps/vox-web
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
