name: QF F6 Client Vendor WhatsApp Sender Isolation (NO DEPLOY)

on:
  pull_request:
    paths:
      - "lib/identity/whatsappAuthLaneIsolation.ts"
      - "services/supabaseSendSmsHookService.ts"
      - "scripts/mvp/vendor/vendor-whatsapp-lane-isolation.test.mjs"
      - "scripts/mvp/launch/verify-whatsapp-lane-isolation-scope.py"
      - ".github/workflows/qf-f6-whatsapp-auth-lane-isolation.yml"
      - "docs/launch/QF-F6-WHATSAPP-CLIENT-VENDOR-LANE-ISOLATION-20261106.md"

permissions:
  contents: read

jobs:
  verify-locked-two-number-otp-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable review head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24 runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Review two sender identities and purpose separation
        run: python3 scripts/mvp/launch/verify-whatsapp-lane-isolation-scope.py --repo .
      - name: Install frozen application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test 20 no-cross-send contract cases
        run: node --import ./scripts/mvp/loader/register.mjs --test scripts/mvp/vendor/vendor-whatsapp-lane-isolation.test.mjs
      - name: Marketplace TypeScript check
        run: npm run typecheck
      - name: Marketplace production build
        run: npm run build
      - name: Exact no-deploy branch diff
        run: python3 scripts/mvp/launch/verify-whatsapp-lane-isolation-scope.py --repo . --exact-git-diff
