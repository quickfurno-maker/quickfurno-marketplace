name: VOX RC17 A-F integration - real Finance PG17, release HOLD
on:
  pull_request:
    paths:
      - 'ops/vox/rc17-review-candidates/**'
      - 'scripts/mvp/vox/rc17-*.test.mjs'
      - 'scripts/mvp/vox/rc18-*.test.mjs'
      - 'scripts/mvp/vox/rc19-*.test.mjs'
      - 'scripts/mvp/vox/rc20-*.test.mjs'
      - 'scripts/mvp/vox/rc21-*.test.mjs'
      - 'scripts/mvp/vox/rc22-*.test.mjs'
      - 'scripts/mvp/vox/rc23-*.test.mjs'
      - 'scripts/mvp/vox/rc24-*.test.mjs'
      - 'scripts/mvp/vox/rc25-*.test.mjs'
      - 'scripts/mvp/vox/rc26-*.test.mjs'
      - 'scripts/mvp/vox/rc27-*.test.mjs'
      - 'scripts/mvp/vox/rc28-*.test.mjs'
      - 'scripts/mvp/vox/rc29-*.test.mjs'
      - 'scripts/mvp/vox/rc31-*.test.mjs'
      - 'scripts/mvp/vox/d-db-release-preflight*.mjs'
      - 'scripts/mvp/vox/rc23-migration-adjudication.mjs'
      - 'scripts/mvp/vox/rc26-migration-release-plan.mjs'
      - 'scripts/mvp/vox/rc27-migration-handoff-validation.mjs'
      - 'scripts/mvp/vox/rc22-migration-release-packet.mjs'
      - 'scripts/mvp/vox/rc18-finance-release-recovery-preflight.mjs'
      - 'scripts/mvp/vox/validate-vox-rc17-*.mjs'
      - 'scripts/mvp/vox/validate-vox-rc21-legacy-v1-parser-pg17.mjs'
      - 'services/vendorPackagePaymentService.ts'
      - 'lib/payments/vendorPackagePaymentReceipts.*'
      - 'lib/payments/vendorPackageRefundEvidence.*'
      - 'lib/payments/vendorPackageWebhookBoundary.*'
      - 'lib/payments/vendorPackageProviderEventLedger.*'
      - 'lib/payments/vendorPackageProviderEventRepository.*'
      - 'scripts/mvp/vox/fixtures/rc28-review-only-provider-event-ledger.pg17.sql'
      - 'lib/payments/vendorPackageRefundReconciliationReview.mjs'
      - 'lib/payments/readBoundedRazorpayWebhookBody.*'
      - 'app/api/webhooks/razorpay/vendor-package/route.ts'
      - 'contracts/vox/rc4ApprovalPipeline.mjs'
      - 'services/vox/rc8PgVendorConversationOperator.ts'
      - 'services/vox/verifiedStaffBearer.ts'
      - 'services/vox/rc19VerifiedConversationWriter.ts'
      - 'services/vox/rc26CoreCommitReconciliation.ts'
      - 'services/vox/rc28VerifiedCoreOutcomeReconciliation.ts'
      - 'services/vox/rc28PendingSignedEodReview.ts'
      - 'apps/vox-web/lib/financeMonth.*'
      - 'scripts/mvp/vox/rc8-pg-signed-intent-writer.mjs'
      - 'scripts/mvp/vox/validate-vox-rc8-real-pg-signed-intent.mjs'
      - 'scripts/mvp/vox/validate-vox-rc8-real-pg-vendor-core.mjs'
      - 'apps/vox-web/app/finance/**'
      - '.github/workflows/vox-rc17-six-tracks-hold.yml'
permissions:
  contents: read
concurrency:
  group: vox-rc17-six-tracks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run RC17-RC31 source, operational and database preflight regressions
        run: node --test scripts/mvp/vox/rc17-*.test.mjs scripts/mvp/vox/rc18-*.test.mjs scripts/mvp/vox/rc19-*.test.mjs scripts/mvp/vox/rc20-*.test.mjs scripts/mvp/vox/rc21-*.test.mjs scripts/mvp/vox/rc22-*.test.mjs scripts/mvp/vox/rc23-*.test.mjs scripts/mvp/vox/rc24-*.test.mjs scripts/mvp/vox/rc25-*.test.mjs scripts/mvp/vox/rc26-*.test.mjs scripts/mvp/vox/rc27-*.test.mjs scripts/mvp/vox/rc28-*.test.mjs scripts/mvp/vox/rc29-*.test.mjs scripts/mvp/vox/rc31-*.test.mjs scripts/mvp/vox/d-db-release-preflight.test.mjs
      - name: Enforce QF MVP 50 Razorpay raw-body financial authority gate
        run: node scripts/mvp/payments/validate-vendor-package-razorpay.mjs
      - name: Compute source migration and recovery HOLD evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mvp/vox/rc18-finance-release-recovery-preflight.mjs | tee "${RUNNER_TEMP}/vox-rc20-recovery.log"
          grep -Fq 'VOX_RC18_RECOVERY_REVIEW_HOLD ' "${RUNNER_TEMP}/vox-rc20-recovery.log"
          node scripts/mvp/vox/rc22-migration-release-packet.mjs | tee "${RUNNER_TEMP}/vox-rc22-migration-handoff.log"
          grep -Fq 'VOX_RC22_MIGRATION_HANDOFF_HOLD ' "${RUNNER_TEMP}/vox-rc22-migration-handoff.log"
          node scripts/mvp/vox/rc23-migration-adjudication.mjs | tee "${RUNNER_TEMP}/vox-rc23-history-hold.log"
          grep -Fq 'VOX_RC23_MIGRATION_HISTORY_HOLD ' "${RUNNER_TEMP}/vox-rc23-history-hold.log"
          node scripts/mvp/vox/rc26-migration-release-plan.mjs | tee "${RUNNER_TEMP}/vox-rc26-migration-hold.log"
          grep -Fq 'VOX_RC26_MIGRATION_RELEASE_PLAN_HOLD ' "${RUNNER_TEMP}/vox-rc26-migration-hold.log"
          node scripts/mvp/vox/rc27-migration-handoff-validation.mjs | tee "${RUNNER_TEMP}/vox-rc27-migration-handoff.log"
          grep -Fq 'VOX_RC27_MIGRATION_HANDOFF_VALIDATION_HOLD ' "${RUNNER_TEMP}/vox-rc27-migration-handoff.log"
      - name: Typecheck Core real application
        run: npm run typecheck
      - name: Preserve release HOLD
        if: always()
        run: echo 'RC17 source-only. No managed releases, payment activation, signing or MFA enrollment.' >> "$GITHUB_STEP_SUMMARY"
  finance-v2-real-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - name: Refuse managed and provider credentials
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${RAZORPAY_LIVE_KEY_SECRET:-}"
          docker pull postgres:17-alpine
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute all five V2 functions on real isolated PG17
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mvp/vox/validate-vox-rc17-razorpay-v2-real-pg17.mjs | tee "${RUNNER_TEMP}/rc17-finance.log"
          grep -Fq 'VOX_RC17_REAL_PG17_RAZORPAY_V2_PASS funcs=5' "${RUNNER_TEMP}/rc17-finance.log"
      - name: Prove immutable V1 parser and first-claim blockers on isolated PG17
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mvp/vox/validate-vox-rc21-legacy-v1-parser-pg17.mjs | tee "${RUNNER_TEMP}/rc21-legacy-v1.log"
          grep -Fq 'VOX_RC21_LEGACY_V1_PG17_PARSER_BLOCKERS_CONFIRMED' "${RUNNER_TEMP}/rc21-legacy-v1.log"
      - name: Prove RC27 Core consent STOP race on real isolated PG17
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mvp/vox/validate-vox-rc8-real-pg-vendor-core.mjs | tee "${RUNNER_TEMP}/rc27-core-pg17.log"
          grep -Fq 'VOX_RC27_REAL_PG17_CORE_CONSENT_SNAPSHOT_RACE_PASS' "${RUNNER_TEMP}/rc27-core-pg17.log"
      - name: Prove RC27 multi-path consent race with real PG17
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/mvp/vox/rc27-e-concurrency-pg17.mjs
      - name: Verify RC28 persistent provider event ledger and repository against isolated PG17
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mvp/vox/validate-vox-rc28-provider-event-ledger-pg17.mjs | tee "${RUNNER_TEMP}/rc28-event-ledger.log"
          grep -Fq 'VOX_RC28_REAL_PG17_EVENT_LEDGER_PASS ' "${RUNNER_TEMP}/rc28-event-ledger.log"
      - name: No abandoned database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          leftover="$(docker ps -aq --filter 'name=^/qf-vox-rc17-v2-pg17$')"
          if [ -n "$leftover" ]; then
            docker rm -f -v "$leftover"
            echo 'FAIL: left disposable PG container behind' >&2
            exit 1
          fi
          legacy="$(docker ps -aq --filter 'name=^/qf-vox-rc21-v1-parser-pg17$')"
          if [ -n "$legacy" ]; then
            docker rm -f -v "$legacy"
            echo 'FAIL: left disposable V1 parser container behind' >&2
            exit 1
          fi
      - name: Refuse abandoned RC28 finance disposable container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          leftover="$(docker ps -aq --filter 'name=^/qf-vox-rc28-event-ledger-')"
          if [ -n "$leftover" ]; then
            docker rm -f -v $leftover
            echo 'FAIL: leftover RC28 disposable PG17 ledger container' >&2
            exit 1
          fi
      - name: Explicit managed release HOLD
        if: always()
        run: echo 'This is a disposable schema. Independent DBA/AppSec + full Supabase-compatible restore + Owner GO still required.' >> "$GITHUB_STEP_SUMMARY"
