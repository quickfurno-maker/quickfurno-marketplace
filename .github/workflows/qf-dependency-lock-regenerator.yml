name: QF Dependency Lock Regenerator

on:
  push:
    branches:
      - integrate/uiux-pune-vendors
    paths:
      - package.json
      - .github/workflows/qf-dependency-lock-regenerator.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/uiux-pune-vendors
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate dependency lockfile"
          git push origin HEAD:integrate/uiux-pune-vendors
