name: Phase 21 Supabase Exit Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/qfj-phase21-supabase-exit-v1.json"
      - "docs/scale/phase-21-supabase-exit-data-portability.md"
      - "docs/scale/phase21-live-supabase-snapshot.json"
      - "docs/scale/phase21-supabase-callsite-manifest.json"
      - "scripts/scale/*phase21*"
      - "package.json"
      - ".github/workflows/phase21-supabase-exit.yml"
  push:
    branches: [main]
    paths:
      - "contracts/qfj-phase21-supabase-exit-v1.json"
      - "docs/scale/phase-21-supabase-exit-data-portability.md"
      - "docs/scale/phase21-live-supabase-snapshot.json"
      - "docs/scale/phase21-supabase-callsite-manifest.json"
      - "scripts/scale/*phase21*"
      - "package.json"
      - ".github/workflows/phase21-supabase-exit.yml"

permissions:
  contents: read

concurrency:
  group: phase21-supabase-exit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://qf_phase21:qf_phase21_ci_only@127.0.0.1:5432/qf_phase21
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
        env:
          POSTGRES_DB: qf_phase21
          POSTGRES_USER: qf_phase21
          POSTGRES_PASSWORD: qf_phase21_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qf_phase21 -d qf_phase21"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify deterministic Supabase call-site manifest
        run: npm run test:scale:phase21:manifest
      - name: Validate Phase 21 provider-exit contract
        run: npm run test:scale:phase21:contract
      - name: Audit migration SQL provider coupling
        run: npm run test:scale:phase21:sql-audit
      - name: Certify portable PostgreSQL semantics
        run: npm run test:scale:phase21:postgres
      - name: Revalidate Phase 20 launch gate
        run: npm run test:scale:phase20:contract
      - name: Verify working tree clean
        run: test -z "$(git status --porcelain)"
