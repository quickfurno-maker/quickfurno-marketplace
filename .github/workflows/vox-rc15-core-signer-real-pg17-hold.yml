name: VOX RC15 Core and signed intent real local PG17 (HOLD)
# Independent disposable PostgreSQL 17 tests, no deployment or human signing.
on:
  pull_request:
    paths:
      - 'services/vox/rc8PgVendorConversationOperator.ts'
      - 'scripts/mvp/vox/rc8-pg-signed-intent-writer.mjs'
      - 'scripts/mvp/vox/validate-vox-rc8-real-pg-vendor-core.mjs'
      - 'scripts/mvp/vox/validate-vox-rc8-real-pg-signed-intent.mjs'
      - 'ops/vox/rc7-review-candidates/**'
      - 'ops/vox/sql-candidates/**'
      - 'contracts/vox/**'
      - '.github/workflows/vox-rc15-core-signer-real-pg17-hold.yml'
permissions:
  contents: read
concurrency:
  group: vox-rc15-pg17-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - name: Refuse managed database environment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          docker pull postgres:17-alpine
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute real Core + reviewed client project + AB7B F1 nonce PostgreSQL test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mvp/vox/validate-vox-rc8-real-pg-vendor-core.mjs | tee "${RUNNER_TEMP}/vox-core-pg17.log"
          grep -Fq 'VOX_RC12_REAL_PG17_AB7B_F1_SOURCE_ATOMIC_PASS' "${RUNNER_TEMP}/vox-core-pg17.log"
          grep -Fq 'VOX_RC12_REAL_PG17_CLIENT_REVIEWED_PROJECT_SCOPE_PASS' "${RUNNER_TEMP}/vox-core-pg17.log"
      - name: Enforce test-container removal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(docker ps -aq --filter 'name=^/qf-vox-rc8-pg-core-vendor$')"
          if [ -n "$remaining" ]; then
            docker rm -f -v "$remaining"
            exit 1
          fi
      - name: Release HOLD
        if: always()
        run: echo 'CORE: synthetic local PG17 only, original managed AB7B blocked, release HOLD' >> "$GITHUB_STEP_SUMMARY"
  two-signer-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - name: Refuse managed environment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}"
          test -z "${SUPABASE_URL:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          docker pull postgres:17-alpine
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute genuine local signed pending-intent PG17 transaction and revocation interlock
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mvp/vox/validate-vox-rc8-real-pg-signed-intent.mjs | tee "${RUNNER_TEMP}/vox-signer-pg17.log"
          grep -Fq 'VOX_RC8_REAL_PG17_SIGNED_INTENT_PASS' "${RUNNER_TEMP}/vox-signer-pg17.log"
      - name: Enforce test-container removal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(docker ps -aq --filter 'name=^/qf-vox-rc8-pg-native$')"
          if [ -n "$remaining" ]; then
            docker rm -f -v "$remaining"
            exit 1
          fi
      - name: Release HOLD
        if: always()
        run: echo 'SIGNER: local synthetic Owner/TL keys only, no actual official EOD approval; release HOLD' >> "$GITHUB_STEP_SUMMARY"
