name: VOX-L3 Signed Private Core Outbox Metrics (Release HOLD)
on:
  pull_request:
    paths:
      - 'app/api/internal/agni/owner-outbox-metrics/**'
      - 'contracts/vox/outboxMetricsAttestation.d.mts'
      - 'scripts/mvp/vox/validate-voxL3-private-metrics-http.spec.mjs'
      - '.github/workflows/vox-l3-core-signed-outbox.yml'
permissions:
  contents: read
jobs:
  private-signed-core-route:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-vm-modules --test scripts/mvp/vox/validate-voxL3-private-metrics-http.spec.mjs
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
