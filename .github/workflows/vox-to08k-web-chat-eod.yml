name: VOX-08K Web Staff Chat and EOD (Release HOLD)
on:
  pull_request:
    paths:
      - 'apps/vox-web/app/team/**'
      - 'apps/vox-web/app/api/team-chat/**'
      - 'apps/vox-web/app/api/eod-submissions/**'
      - 'apps/vox-web/app/api/eod-reviews/**'
      - 'apps/vox-web/lib/teamWorkflow.ts'
      - 'apps/vox-web/scripts/validate-governed-workflows-08k.spec.mjs'
      - 'apps/vox-web/package.json'
      - '.github/workflows/vox-to08k-web-chat-eod.yml'
permissions:
  contents: read
jobs:
  mock-auth-core-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/vox-web
      - run: npm test
        working-directory: apps/vox-web
      - run: npm run typecheck
        working-directory: apps/vox-web
      - run: npm run build
        working-directory: apps/vox-web
