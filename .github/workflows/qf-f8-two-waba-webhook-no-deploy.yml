name: QF F8 Separate Riya Anisha Inbound Webhooks (NO DEPLOY)

on:
  pull_request:
    paths:
      - "lib/communication/providers/metaCloudWhatsAppConfig.ts"
      - "scripts/mvp/vendor/vendor-dual-waba-webhook-registry.test.mjs"
      - "supabase/migrations/20261106120124_qf_f8_dormant_riya_client_provider_account.sql"
      - "scripts/mvp/launch/verify-two-waba-webhook-scope.py"
      - ".github/workflows/qf-f8-two-waba-webhook-no-deploy.yml"
      - "docs/launch/QF-F8-TWO-WABA-WEBHOOK-STAGING-20261106.md"

permissions:
  contents: read

jobs:
  certify-two-meta-inbound-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact proposed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Validate exact source + real Staging migration checksum
        run: python3 scripts/mvp/launch/verify-two-waba-webhook-scope.py --repo .
      - name: Install frozen app dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test both callback identities and previous vendor OTP/returning flows
        run: node --import ./scripts/mvp/loader/register.mjs --test scripts/mvp/vendor/vendor-dual-waba-webhook-registry.test.mjs scripts/mvp/vendor/vendor-dedicated-otp-transport.test.mjs scripts/mvp/vendor/vendor-whatsapp-lane-isolation.test.mjs scripts/mvp/vendor/vendor-returning-login.test.mjs
      - name: Existing Riya Anisha Aarohi Jarvis WhatsApp isolation regressions
        run: node --import ./scripts/mvp/loader/register.mjs scripts/mvp/jarvis/validate-qf-whatsapp-jarvis-readiness.mjs
      - name: Full Marketplace TypeScript check
        run: npm run typecheck
      - name: Full Next optimized production build
        run: npm run build
      - name: Verify exact no-deploy branch scope
        run: python3 scripts/mvp/launch/verify-two-waba-webhook-scope.py --repo . --exact-git-diff
