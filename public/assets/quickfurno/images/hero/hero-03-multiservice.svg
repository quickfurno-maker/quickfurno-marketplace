<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="presentation" aria-hidden="true">
  <!-- QuickFurno hero artwork 03 — layered multi-service composition.
       Interior / carpentry / finish cues as overlapping planes, deliberately
       editorial rather than a collage. Original abstract vector art. -->
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf5"/><stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="c-paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa4e8"/><stop offset="1" stop-color="#c8dcff"/>
    </linearGradient>
    <linearGradient id="c-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcb083"/><stop offset="1" stop-color="#c2915c"/>
    </linearGradient>
  </defs>

  <rect width="640" height="800" fill="url(#c-bg)"/>

  <!-- Plane 1 (back) — framed interior opening, deepest value. -->
  <rect x="176" y="70" width="330" height="292" rx="8" fill="#33465f"/>
  <rect x="198" y="92" width="286" height="248" rx="4" fill="#eef3fa"/>
  <path d="M341 92v248M198 216h286" stroke="#c3cddc" stroke-width="6"/>

  <!-- Plane 2 (mid-left) — finish / paint swatch. -->
  <rect x="86" y="266" width="228" height="240" rx="8" fill="url(#c-paint)"/>
  <path d="M86 346h228M86 426h228" stroke="#ffffff" stroke-width="5" opacity="0.65"/>

  <!-- Plane 3 (mid-right) — timber / carpentry edge. -->
  <rect x="356" y="320" width="196" height="266" rx="8" fill="url(#c-wood)"/>
  <path d="M356 386h196M356 452h196M356 518h196" stroke="#a3743f" stroke-width="3" opacity="0.5"/>

  <!-- Front white card: the single enquiry that ties them together. -->
  <rect x="196" y="470" width="228" height="132" rx="10" fill="#ffffff"/>
  <rect x="196" y="470" width="228" height="132" rx="10" fill="none" stroke="#b9c6d8" stroke-width="5"/>
  <path d="M228 512h116M228 546h164" stroke="#c3cddc" stroke-width="10" stroke-linecap="round"/>
  <rect x="228" y="566" width="96" height="14" rx="7" fill="#2563eb"/>

  <!-- Connective route: three services, one enquiry. -->
  <path d="M200 402h-58v226h72" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <circle cx="142" cy="628" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="6"/>

  <!-- Ground. -->
  <ellipse cx="320" cy="646" rx="234" ry="17" fill="#8fa0b8" opacity="0.3"/>
  <path d="M120 692h190M340 692h120" stroke="#c3cddc" stroke-width="8" stroke-linecap="round"/>
</svg>
