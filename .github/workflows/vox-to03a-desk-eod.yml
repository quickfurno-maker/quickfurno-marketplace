name: VOX TO-03A Scoped Unified Inbox and Evidence EOD
on:
  pull_request:
    paths:
      - 'contracts/vox/unifiedDeskAndEod.mjs'
      - 'scripts/mvp/vox/validate-to03a-desk-eod.test.mjs'
      - '.github/workflows/vox-to03a-desk-eod.yml'
permissions:
  contents: read
jobs:
  no-message-no-fabricated-report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --check contracts/vox/unifiedDeskAndEod.mjs
      - run: node --test scripts/mvp/vox/validate-to03a-desk-eod.test.mjs
