name: VOX-08 Restricted Team Leader Reviewer
on:
  pull_request:
    paths:
      - 'supabase/migrations/*vox_v1_team_leader_review_policy.sql'
      - 'contracts/vox/scopedStaff.mjs'
      - 'app/api/vox/v1/staff-grants/**'
      - 'scripts/mvp/vox/validate-vox08-source.mjs'
      - '.github/workflows/vox-08-team-leader.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewer-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node scripts/mvp/vox/validate-vox08-source.mjs
