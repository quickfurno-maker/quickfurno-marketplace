name: quickfurno

services:
  web:
    image: quickfurno:${QF_IMAGE_TAG:?QF_IMAGE_TAG must be an immutable git SHA}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      QF_RUNTIME_ROLE: web
      QF_RELEASE_SHA: ${QF_IMAGE_TAG}
    env_file:
      - ${QF_ENV_FILE:?QF_ENV_FILE must point to an external production env file}
    ports:
      - "127.0.0.1:${QF_WEB_HOST_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz',{cache:'no-store'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [qf-private]

  automation-worker:
    image: quickfurno:${QF_IMAGE_TAG:?QF_IMAGE_TAG must be an immutable git SHA}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      QF_RUNTIME_ROLE: automation-worker
      QF_RELEASE_SHA: ${QF_IMAGE_TAG}
    env_file:
      - ${QF_ENV_FILE:?QF_ENV_FILE must point to an external production env file}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 768m
    cpus: 0.75
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [qf-private]

  conversation-transport:
    image: quickfurno:${QF_IMAGE_TAG:?QF_IMAGE_TAG must be an immutable git SHA}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      QF_RUNTIME_ROLE: conversation-transport
      QF_RELEASE_SHA: ${QF_IMAGE_TAG}
    env_file:
      - ${QF_ENV_FILE:?QF_ENV_FILE must point to an external production env file}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 768m
    cpus: 0.75
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [qf-private]

networks:
  qf-private:
    driver: bridge
