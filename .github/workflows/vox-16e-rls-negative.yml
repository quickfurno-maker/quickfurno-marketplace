name: VOX-16E PG17 actual role denial
on:
  pull_request:
    paths:
      - 'scripts/mvp/vox/validate-vox16-full-seven-pg17.ps1'
      - '.github/workflows/vox-16e-rls-negative.yml'
      - 'docs/vox/VOX-16E-PG17-ROLE-NEGATIVE.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  role-denials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - shell: pwsh
        run: ./scripts/mvp/vox/validate-vox16-full-seven-pg17.ps1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: '20.20.2'}
      - run: node scripts/mvp/vox/validate-vox16c-staging-evidence.mjs
