name: VOX UI-04 Core Authenticated Runtime Read (Release HOLD)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/ui04-workspace/**'
      - 'contracts/vox/ui04RouteFusion*'
      - 'contracts/vox/ui04UnifiedQueue.mjs'
      - 'scripts/mvp/vox/validate-voxUI04-route-fusion.test.mjs'
      - '.github/workflows/vox-ui04-core-runtime-readonly.yml'
permissions:
  contents: read
jobs:
  source-and-authorization-denials:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - name: Core VOX authenticated source integration tests
        run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check Core authenticated route
        run: npm run typecheck
      - name: Production build, not deployment
        run: npm run build
