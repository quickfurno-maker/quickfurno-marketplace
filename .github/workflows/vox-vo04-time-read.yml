name: VOX VO4 Authoritative Staff Time Read - RELEASE HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'contracts/vox/virtualOfficeTimeRead.*'
      - 'app/api/vox/v1/staff-time-state/**'
      - 'scripts/mvp/vox/vo04-time-*.test.mjs'
      - '.github/workflows/vox-vo04-time-read.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source verified Staff time read and route boundary
        run: node --test scripts/mvp/vox/vo04-time-read.test.mjs scripts/mvp/vox/vo04-time-read-route.test.mjs
      - name: Root TypeScript and types
        run: ./node_modules/.bin/tsc --noEmit
