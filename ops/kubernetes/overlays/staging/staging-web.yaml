apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickfurno-web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: QF_RUNTIME_ENV
              value: staging
            - name: QF_ALLOW_STAGING_RUNTIME
              value: "1"
            - name: NEXT_PUBLIC_SUPABASE_URL
              value: https://uckafzuochmbvtiodmcl.supabase.co
