name: VOX Safe Work Queue and Capability Catalog
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/work-queue/**'
      - 'app/api/vox/v1/staff-capability-catalog/**'
      - 'contracts/vox/workQueuePreview.*'
      - 'contracts/vox/scopedWorkCandidates.*'
      - 'contracts/vox/rc1CurrentStaffScope.*'
      - 'contracts/vox/staffDepartmentPacks.*'
      - 'scripts/mvp/vox/validate-vox-safe-workqueue-read-20261030.mjs'
      - '.github/workflows/vox-safe-workqueue-read.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-read-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: node scripts/mvp/vox/validate-vox-safe-workqueue-read-20261030.mjs
