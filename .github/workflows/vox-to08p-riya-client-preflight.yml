name: VOX-08P Riya Client Scope Preflight (Release HOLD)
on:
  pull_request:
    paths:
      - 'contracts/vox/riyaClientHandoverGate.mjs'
      - 'scripts/mvp/vox/validate-to08p-riya-preflight.test.mjs'
      - 'docs/vox/VOX-08P-*'
      - '.github/workflows/vox-to08p-riya-client-preflight.yml'
permissions:
  contents: read
jobs:
  read-only-handover-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/*.test.mjs
