name: VOX-L2 Canonical Riya Client Cases (Release HOLD)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/riya-client-cases/**'
      - 'contracts/vox/verifiedClientCasePreview.*'
      - 'contracts/vox/effectiveDepartments.mjs'
      - 'contracts/vox/scopedStaff.d.mts'
      - 'scripts/mvp/vox/validate-voxL2-client-case-reader.test.mjs'
      - '.github/workflows/vox-l2-real-client-cases.yml'
permissions:
  contents: read
jobs:
  read-only-client-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-voxL2-client-case-reader.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test scripts/mvp/vox/*.test.mjs
