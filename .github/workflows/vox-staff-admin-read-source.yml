name: VOX Staff Admin Read Source (No Deploy)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/staff-directory/**'
      - 'app/api/vox/v1/staff-review-queue/**'
      - 'scripts/mvp/vox/validate-vox-staff-admin-read-20261029.mjs'
      - '.github/workflows/vox-staff-admin-read-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-staff-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: node scripts/mvp/vox/validate-vox-staff-admin-read-20261029.mjs
