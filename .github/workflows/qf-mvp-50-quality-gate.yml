          printf 'PHASE14_CI_ONLY=1\n' > .phase14-ci.env
          QF_IMAGE_REF='quickfurno@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
