name: VOX-F1 Canonical Source Bridging QA (Release HOLD)
on:
  pull_request:
    paths:
      - 'contracts/vox/f1CertifiedFourSourceEod.*'
      - 'app/api/vox/v1/eod-certified-preview/**'
      - 'ops/vox/sql-candidates/20261017010000_vox_f1_four_source_attribution_candidate.sql'
      - 'ops/vox/tests/invoke-f1-isolated-pg17.ps1'
      - 'worker/voxInternalNotificationSupervisor.mjs'
      - 'scripts/mvp/vox/validate-voxF1-*'
      - 'docs/vox/VOX-F1-INTERNAL-INTEGRATION-STATUS.md'
      - '.github/workflows/vox-f1-canonical-source-bridge.yml'
permissions:
  contents: read
jobs:
  source-contract-no-managed-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
      - run: test ! -e supabase/migrations/20261017010000_vox_f1_four_source_attribution_candidate.sql
