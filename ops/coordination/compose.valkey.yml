name: quickfurno

services:
  valkey:
    image: valkey/valkey@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    restart: unless-stopped
    init: true
    read_only: true
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --dir
      - /data
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    tmpfs:
      - /data:rw,noexec,nosuid,nodev,size=320m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [qf-private]

networks:
  qf-private:
    driver: bridge
