name: VOX Governed Work Transitions (Fail-Closed, No Deploy)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/work-transitions/**'
      - 'scripts/mvp/vox/validate-vox-governed-transition-20261030.mjs'
      - '.github/workflows/vox-governed-work-transitions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transition-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: node scripts/mvp/vox/validate-vox-governed-transition-20261030.mjs
