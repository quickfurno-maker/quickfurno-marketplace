name: VOX VO3 Combined Virtual Office Source and Typecheck - HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'app/api/vox/v1/staff-time/**'
      - 'contracts/vox/virtualOffice*.mjs'
      - 'services/vox/virtualOffice*.mjs'
      - 'services/vox/virtualOffice*.d.mts'
      - 'apps/vox-web/lib/vo03PendingStaffTime.mjs'
      - 'scripts/mvp/vox/vo0*-*.test.mjs'
      - 'ops/vox/vo02-review-candidates/**'
      - '.github/workflows/vox-vo03-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-vo3-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Install pinned project dependencies, no lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: All Virtual Office VO0–VO3 negative and positive source tests
        run: |
          node --test \
            scripts/mvp/vox/vo00-virtual-office-contract.test.mjs \
            scripts/mvp/vox/vo01-virtual-office-time-state.test.mjs \
            scripts/mvp/vox/vo01-virtual-office-time-report.test.mjs \
            scripts/mvp/vox/vo01-virtual-office-chat-checkpoint.test.mjs \
            scripts/mvp/vox/vo01-virtual-office-meet-provider.test.mjs \
            scripts/mvp/vox/vo02-time-writer.test.mjs \
            scripts/mvp/vox/vo02-presence-projection.test.mjs \
            scripts/mvp/vox/vo03-time-core-route.test.mjs \
            scripts/mvp/vox/vo03-team-leader-delegation.test.mjs \
            scripts/mvp/vox/vo03-staff-time-recovery.test.mjs
      - name: Check root TypeScript
        run: ./node_modules/.bin/tsc --noEmit
