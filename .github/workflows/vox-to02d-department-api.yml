name: VOX TO-02D Governed Department API Source
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/staff-department-actions/**'
      - 'scripts/mvp/vox/validate-to02d-department-api.test.mjs'
      - '.github/workflows/vox-to02d-department-api.yml'
permissions:
  contents: read
jobs:
  core-department-http-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-to02d-department-api.test.mjs
