name: VOX-16B Native Service Desk status
on:
  pull_request:
    paths:
      - 'contracts/vox/serviceDesk.mjs'
      - 'scripts/mvp/vox/validate-vox16b-service-desk.mjs'
      - 'docs/vox/VOX-16B-SERVICE-DESK.md'
      - '.github/workflows/vox-16b-service-desk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-case-states:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '20.20.2' }
      - run: |
          node scripts/mvp/vox/validate-vox16b-service-desk.mjs
          node scripts/mvp/vox/validate-vox-11-qa.mjs
