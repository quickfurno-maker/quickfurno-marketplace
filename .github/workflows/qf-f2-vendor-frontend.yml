name: QF F2 Vendor WhatsApp Frontend (NO DEPLOY)

on:
  pull_request:
    paths:
      - "app/vendor/page.tsx"
      - "components/VendorRegisterForm.tsx"
      - "components/vendor/VendorPrivateEvidenceForm.tsx"
      - "lib/vendors/vendorSignupUi.ts"
      - "scripts/mvp/vendor/vendor-phase2-ui-contract.test.mjs"
      - "scripts/mvp/launch/verify-vendor-frontend.py"
      - "scripts/mvp/launch/test_vendor_frontend_scope.py"
      - "scripts/mvp/launch/smoke-vendor-frontend.mjs"
      - "docs/launch/f2-vendor-frontend-manifest.json"
      - "docs/launch/F2-VENDOR-WHATSAPP-FRONTEND-20261106.md"
      - ".github/workflows/qf-f2-vendor-frontend.yml"

permissions:
  contents: read

jobs:
  exact-vendor-ui-and-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source with pinned read-only GitHub action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24 for TypeScript UI contract checks
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Pin four vendor UI source files and enforce every release hold
        run: python3 scripts/mvp/launch/verify-vendor-frontend.py --repo .
      - name: Adversarial source mutation and scope tests
        run: python3 -m unittest discover -s scripts/mvp/launch -p test_vendor_frontend_scope.py -v
      - name: Existing WhatsApp and private-evidence UI contracts
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/mvp/loader/register.mjs --test scripts/mvp/vendor/vendor-phase2-ui-contract.test.mjs
      - name: Install pinned Marketplace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck complete Marketplace and vendor form
        run: npm run typecheck
      - name: Compile complete Marketplace Core and vendor frontend
        run: npm run build
      - name: Run provider-isolated loopback HTTP smoke (no external services)
        run: node scripts/mvp/launch/smoke-vendor-frontend.mjs
      - name: Enforce exact Git diff vs isolated Core PR
        run: python3 scripts/mvp/launch/verify-vendor-frontend.py --repo . --exact-git-diff
