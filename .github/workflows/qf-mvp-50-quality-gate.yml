name: QF MVP 50 Quality Gate

# Repository-only gate: offline validators, typecheck and build on a GitHub-hosted
# runner. It takes no secrets and makes no staging, provider or deployment calls.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      # Durable QF-MVP-50 feature-branch glob. The previous single-branch filter
      # went stale the moment that branch merged, silently disabling push runs.
      - 'mvp/qf-mvp-50-*'
      # QF-MVP-75 matching/geography branches change the money path, and this
      # gate already runs their validators. Without this glob a 75.x branch got
      # push coverage only once a pull request existed.
      - 'mvp/qf-mvp-75-*'
      - 'feat/aarohi-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On a pull_request event actions/checkout defaults to refs/pull/<n>/merge,
      # a synthetic merge commit that is not the reviewed head. Pin the event head
      # SHA explicitly so the gate proves the exact code under review.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # The QF-MVP-40.10 containment guards prove a claim over a pinned historical commit
          # range. A depth-1 checkout would not contain those ancestor objects and the guards
          # would fail closed, so the full history is required.
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      # The MVP validators import .ts modules through a resolve-only hook and rely
      # on Node's native type stripping, which Node 20 does not provide.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Report Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      # QF-MVP-40 provider/template authority is what the 50.x orchestration consumes, so the
      # exact-head gate proves it too. All offline: no secrets, no Meta, no Supabase.
      - name: QF-MVP-40.4 template catalogue
        run: npm run test:mvp:40-4

      - name: QF-MVP-40.10A Meta template contract
        run: npm run test:mvp:40-10a

      - name: QF-MVP-40.10B Wave 1 readiness
        run: node scripts/mvp/communication/validate-meta-wave1-readiness.mjs

      - name: QF-MVP-40.11 inactive mapping readiness
        run: npm run test:mvp:40-11

      - name: QF-MVP-40.12-R1 business template bindings
        run: npm run test:mvp:40-12-r1

      - name: QF-MVP-50.1A validator
        run: npm run test:mvp:50-1a

      - name: QF-MVP-50.1B validator
        run: npm run test:mvp:50-1b

      - name: QF-MVP-50.2C-S2-G1 staging history governance
        run: npm run test:mvp:50-2c-s2-g1

      # Native Automation Engine replaces the retired n8n execution runtime.
      # It keeps the hardened Core/Postgres action, queue, retry, consent and
      # communication authorities while removing HTTP polling/orchestration.
      - name: QuickFurno Native Automation Engine guard
        run: npm run test:automation-native

      - name: QuickFurno conversation fast-path guard
        run: npm run test:mvp:conversation-fastpath

      - name: Build conversation transport worker
        run: npm run build:conversation-transport

      - name: Automation Studio control-plane guard
        run: npm run test:automation-studio

      - name: QF launch security closeout validator
        run: npm run test:security:launch-closeout

      - name: QF-MVP-50.3/50.4 policy-config bridge validator
        run: npm run test:mvp:50-3-50-4-bridge

      - name: QF-MVP-50.3/50.4 staging forensic reconciliation
        run: npm run test:mvp:50-3-50-4-forensic

      # QF-MVP-70 Operations & Launch Control. The admin cockpit reads the same
      # canonical automation, communication, webhook and lead-assignment rows the
      # 50.x orchestration owns, so its read-only and fail-closed guarantees are
      # proved at the same exact head. All four are offline file-level harnesses:
      # no secrets, no Supabase, no Meta, no n8n.
      - name: QF-MVP-70.01 operations control center
        run: npm run test:mvp:70-01

      - name: QF-MVP-70.02 attention queue and incident detail
        run: npm run test:mvp:70-02

      - name: QF-MVP-70.03 launch control consolidation
        run: npm run test:mvp:70-03

      - name: QF-MVP-70.04 final certification
        run: npm run test:mvp:70-04

      # QF-MVP-75.01 — the marketplace MONEY PATH. The QF-MVP-75.00 audit proved
      # this gate did not cover matching or assignment at all, while 75.01 changes
      # which eligible vendors actually win a lead and therefore which wallets are
      # debited. These four are the minimum that must be green at the exact head
      # before such a change can merge. All offline file-level harnesses: no
      # secrets, no Supabase, no Meta, no n8n.
      - name: QF-MVP-75.01 MatchCore binding rank order
        run: npm run test:mvp:75-01

      # QF-MVP-75.02 — the geo foundation the money path now carries evidence for.
      # It adds the FIRST QuickFurno migration that installs a database extension
      # (postgis), two GENERATED geography columns, two GiST indexes and one
      # read-only service_role-only shortlist RPC, so its offline contract is
      # proved at the same exact head as the assignment authority it must never
      # become. Offline file-level harness: no secrets, no Supabase, no Meta,
      # no n8n.
      - name: QF-MVP-75.02 geo normalization and PostGIS shortlist
        run: npm run test:mvp:75-02

      - name: Fair opportunity distribution
        run: npm run test:mvp:fair-opportunity

      # Verified location + straight-line geography. Google Places/GPS may
      # capture WGS84 coordinates, but routing stays entirely inside QuickFurno:
      # no Routes key, provider switch, matrix call or traffic dependency.
      - name: Verified location and straight-line geography
        run: npm run test:mvp:location-straight-line
      - name: Vendor location backfill authority
        run: npm run test:mvp:vendor-location-backfill

      - name: Public Google location surfaces
        run: npm run test:mvp:public-google-location

      - name: Vendor V1/V2 onboarding and commercial authority
        run: npm run test:mvp:vendor-v1-v2

      - name: Vendor package payment authority
        run: npm run test:mvp:vendor-package-payment

      - name: Vendor V3-V5 delivery, recovery and intelligence authority
        run: npm run test:mvp:vendor-v3-v5

      - name: QF-MVP-80.02 GATE-06 vendor login activation
        run: npm run test:mvp:80-02-gate06

      - name: QF-MVP-80.03 audit log repair + actor attribution
        run: npm run test:mvp:80-03-audit

      - name: QF-MVP-80.04 fail-closed runtime default
        run: npm run test:mvp:80-04

      # QF-MVP-80.14A — the ONLY authority in the repository that can assign
      # activation_status = 'active', i.e. the switch that turns real outbound
      # WhatsApp on in production. Its narrowness is the whole safety argument:
      # one hard-coded lane, every switch a constant, durable delivered-canary
      # proof required, and postconditions that roll the call back on drift. That
      # must be proved at the exact head of every change, not just its own.
      # Offline file-level harness: no secrets, no Supabase, no Meta, no n8n.
      - name: QF-MVP-80.14A Meta production activation authority
        run: npm run test:mvp:80-14a

      # QF-MVP-40.14 — the seed + one-at-a-time activation route for the four
      # further Meta transactional templates. It is the only repository-side way
      # a fifth, sixth, seventh or eighth template can ever start sending, so its
      # narrowness is proved at the exact head of every change: a closed four-key
      # vocabulary, every provider/category/language/version/schema value a
      # constant, a seed that lands INACTIVE and refuses drift, and the live
      # lead_assignment_alert lane plus the kill switch left untouched.
      # Offline file-level harness: no secrets, no Supabase, no Meta, no n8n.
      - name: QF-MVP-40.14 Meta transactional mapping authority
        run: npm run test:mvp:40-14

      - name: Marketplace eligibility and category contract
        run: npm run test:mvp:marketplace

      - name: Canonical assignment-authority contract
        run: npm run test:mvp:assignment-authority

      - name: Phase 4 credit wallet and candidate-pool invariants
        run: npm run test:phase4

      - name: QF-MVP-80.16B vendor destination normalization
        run: npm run test:mvp:80-16b

      - name: QF-MVP-80.16C delivery safety closure
        run: npm run test:mvp:80-16c

      # QF-MVP-80.17A — the DERIVED lead-assignment intent projection. Production
      # proved the drift (message failed / intent still dispatched), so the
      # forward-only rules, the deterministic linkage fences and the single-column
      # compare-and-set are executed here against the real pure contract.
      # Offline: no secrets, no network, no Supabase, no send.
      - name: QF-MVP-80.17A lead-assignment terminal reconciliation
        run: npm run test:mvp:80-17a

      # QF-MVP-80.17A-R1 — the ONE-SHOT operator for the single historical
      # QF-MVP-80.16D-R2 anomaly (canonical message failed / derived intent
      # dispatched). It can reach production, so its narrowness is proved at the
      # exact head: dry run by default, the production project fence, a frozen
      # 30-minute trial window no argument can widen, exactly one candidate, a
      # single-use attestation, and the repair performed only by the deployed
      # 80.17A service. Offline: no secrets, no network, no Supabase, no send.
      - name: QF-MVP-80.17A-R1 controlled historical reconciliation
        run: npm run test:mvp:80-17a-r1

      # The same loader smoke also runs here on Node 24, so a regression is
      # caught by the main gate as well as by the production-runtime job below.
      - name: QF-MVP-80.17A-R1 runtime loader smoke
        run: npm run test:mvp:80-17a-r1-loader

      # QF-MVP-82A-R0 — Realtime publication membership for the two WhatsApp inbox
      # authorities. A migration is a governance event here: it moves the live tree
      # pin, the post-anchor accounting and the staging-history PENDING set, so its
      # shape is proved at the exact head — exactly two schema-qualified tables,
      # never FOR ALL TABLES, no RLS or policy change, no grant, no row touched,
      # and no application file riding along.
      # Offline: no secrets, no network, no Supabase, no send.
      - name: QF-MVP-82A-R0 Realtime publication foundation
        run: npm run test:mvp:82a-r0

      # QF-MVP-82A-R0-S1 — the staging deployment record for that migration.
      # Documentary only, and its whole job is to keep one distinction from
      # drifting: R0 is applied to STAGING and explicitly NOT to production. It
      # also holds the 80.14A activation authority unapplied in both environments,
      # keeps the frozen 80.05 reconciliation count at 102 against a live tree of
      # 104, and proves no application or inbox file rode along.
      # Offline: no secrets, no network, no Supabase, no send.
      - name: QF-MVP-82A-R0-S1 staging deployment certification
        run: npm run test:mvp:82a-r0-s1

      - name: QF-UI-HOTFIX-01 mobile form focus + homepage layout
        run: npm run test:ui:mobile-form-focus

      # QF-UI-TRACKING-01 — paid-acquisition attribution. A production lead filed
      # with every utm_* null because both lead surfaces sampled the URL only at
      # submit time. This executes the real tracking module against simulated
      # browsers (including a hostile sessionStorage) and proves the duplicate
      # readers stay deleted. Offline: no secrets, no network, no Supabase.
      - name: QF-UI-TRACKING-01 lead attribution persistence
        run: npm run test:ui:lead-attribution

      - name: Database-backed city and service-zone authority
        run: npm run test:launch:city-authority

      - name: Admin service-zone boundary control
        run: npm run test:launch:service-zone-boundary

      - name: Aarohi Acquisition CRM guard
        run: npm run test:aarohi:crm

      - name: Aarohi Phase 2 autonomous acquisition guard
        run: npm run test:aarohi:phase2

      - name: WhatsApp / Jarvis conversational readiness
        run: npm run test:mvp:whatsapp-jarvis

      - name: WhatsApp / Jarvis signed media bridge
        run: npm run test:mvp:whatsapp-media-bridge

      - name: WhatsApp essential feature certification
        run: npm run test:mvp:whatsapp-essential

      - name: WhatsApp Human Desk certification
        run: npm run test:mvp:whatsapp-human-desk

      # SCALE-P01 — portability ratchet. Offline: no secrets, no network.
      # Prevents new direct infrastructure coupling while known single-host debt
      # remains explicitly pinned to its remediation phase.
      - name: Infrastructure portability contract
        run: npm run test:scale:portability

      - name: QuickFurno container contract
        run: npm run test:scale:container

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ==========================================================================
  # QF-MVP-80.17A-R1 — PRODUCTION RUNTIME loader smoke.
  #
  # The R1 operator runs on the production VPS, which is Node 20 and cannot load
  # `.ts` natively at all — that is the entire reason its CommonJS loader exists.
  # The main gate above runs on Node 24, so it cannot prove the loader works
  # where it will actually be used. An earlier revision passed 76/76 on Node 24
  # while carrying a loader that would have refused its own dependency in
  # production, because nothing ever called loadR1Runtime().
  #
  # This job executes it for real. Entirely offline: no secrets, no Supabase or
  # Meta environment, no database connection, no network, no send.
  # ==========================================================================
  r1-runtime-loader-node20:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Report Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: QF-MVP-80.17A-R1 runtime loader smoke on production Node 20
        run: npm run test:mvp:80-17a-r1-loader

      - name: QuickFurno native worker startup smoke on production Node 20
        run: |
          npm run build:automation-worker
          set +e
          OUTPUT=$(QF_NATIVE_AUTOMATION_MODE=shadow QF_NATIVE_AUTOMATION_WORKER_ID='!' node dist/automation-worker.mjs 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$CODE" -ne 0
          grep -q 'NATIVE_AUTOMATION_WORKER_ID_INVALID' <<< "$OUTPUT"
          ! grep -q 'next/headers' <<< "$OUTPUT"
          ! grep -q 'server-only' <<< "$OUTPUT"
          ! grep -q 'without native WebSocket support' <<< "$OUTPUT"

  # SCALE-P02 — exact-head immutable image certification.
  # Docker-specific configuration stays inside the offline repository script so
  # this locked quality workflow remains free of secrets/providers/staging calls.
  container-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run exact-head container certification
        run: node scripts/scale/certify-container-image.mjs
