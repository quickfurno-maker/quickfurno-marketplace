name: VOX-23 Security Exception Fail-Closed Review
on:
  pull_request:
    paths:
      - 'ops/vox/staging-security-posture-20261014.json'
      - 'ops/vox/staging-security-readonly.sql'
      - 'scripts/mvp/vox/validate-vox23-security-exceptions.mjs'
      - 'docs/vox/VOX-23-SECURITY-EXCEPTIONS.md'
      - '.github/workflows/vox-23-security-exceptions.yml'
      - 'supabase/migrations/20260723000600_qf_mvp_public_projection_privilege_hardening.sql'
      - 'supabase/migrations/20260620000002_rls_policies.sql'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  enforce-published-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: '20.20.2'}
      - run: |
          node scripts/mvp/vox/validate-vox23-security-exceptions.mjs --self-test
          node scripts/mvp/vox/validate-vox16c-staging-evidence.mjs
