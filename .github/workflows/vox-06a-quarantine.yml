name: VOX-06A Seven Legacy SQL Quarantine and DBA HOLD
on:
  pull_request:
    paths:
      - 'ops/vox/quarantined-migrations/legacy-20261014/**'
      - 'supabase/migrations/**'
      - 'ops/vox/certification/VOX-PR300-MANAGED-SQL-RELEASE-HOLD.json'
      - 'scripts/mvp/vox/validate-vox06a-quarantine.test.mjs'
      - '.github/workflows/vox-06a-quarantine.yml'
permissions:
  contents: read
jobs:
  exact-quarantine-no-autoapply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-vox06a-quarantine.test.mjs scripts/mvp/vox/validate-pr300-managed-migration-hold.test.mjs
      - name: No DBA signatures means deployment must still fail
        shell: bash
        run: |
          set +e
          node scripts/mvp/vox/verify-pr300-managed-migration-hold.mjs --release-check
          CODE=$?
          set -e
          test "$CODE" -eq 42
