# Scale Phase 15 example only. Do not install automatically.
#
# The active-upstream include is written atomically by nginx-switch.sh.
include /etc/nginx/quickfurno/phase15-active-upstream.conf;

location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_pass $qf_phase15_upstream;
}
