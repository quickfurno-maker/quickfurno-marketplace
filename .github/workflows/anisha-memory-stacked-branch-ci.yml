name: Anisha Core Stacked Branch CI

on:
  push:
    branches:
      - feat/anisha-core-memory-consent
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anisha-core-consent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-core-cert:
    name: Anisha Core consent cert
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm Core consent and user dashboard boundaries
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/mvp/loader/register.mjs scripts/mvp/jarvis/validate-anisha-memory-consent.mjs
      - name: Confirm Core purge and ACK contracts
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/mvp/loader/register.mjs scripts/mvp/jarvis/validate-anisha-memory-purge.mjs
      - name: Test the actual Core signed request verifier
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/mvp/loader/register.mjs scripts/mvp/jarvis/validate-anisha-memory-signature.mjs
      - name: Certify actual Next.js HTTPS Core memory routes (loopback only)
        run: node scripts/mvp/jarvis/certify-anisha-https-next-routes.mjs
      - name: Typecheck the entire Core application
        run: npm run typecheck

  paired-jarvis-core-https-cert:
    name: Real Jarvis client to Core HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Core draft head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: core
      - name: Checkout pinned Jarvis A2h source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: quickfurno-maker/qf-jarvis
          ref: 82972d573bb3a83275dc5d5fe85c50cfc0241b39
          path: jarvis
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.11.0
      - name: Setup Node 24 for Jarvis pnpm 11
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: jarvis/pnpm-lock.yaml
      - name: Install Jarvis locked packages
        working-directory: jarvis
        run: pnpm install --frozen-lockfile
      - name: Build exact Jarvis packages
        working-directory: jarvis
        run: pnpm build
      - name: Bundle only actual signed Jarvis client and purge worker
        working-directory: jarvis
        run: |
          npm exec --yes --package=esbuild@0.28.2 -- esbuild \
            apps/api/src/quickfurno-whatsapp/anisha-a2h-staging-client.ts \
            --bundle --platform=node --format=esm --target=node20 \
            --outfile=../anisha-a2h-jarvis-transport.mjs --log-level=warning
          test -s ../anisha-a2h-jarvis-transport.mjs
      - name: Build isolated Core Next certification image
        run: docker build --progress=plain -f core/ops/anisha-a2g/Dockerfile.cert -t qf-anisha-a2h-paired-ci:local core
      - name: Actual signed Jarvis worker → Core Next HTTPS (synthetic only)
        run: |
          docker run --rm --name qf-anisha-paired-https-ci \
            --network none --memory 3g --cpus 2 \
            -v "${PWD}/anisha-a2h-jarvis-transport.mjs:/tmp/a2h-jarvis-client.mjs:ro" \
            -e ANISHA_CERT_JARVIS_BUNDLE=/tmp/a2h-jarvis-client.mjs \
            qf-anisha-a2h-paired-ci:local
