name: VOX AB7B Genuine Support-Task Atomic Source - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'ops/vox/sql-candidates/20261018040000_vox_ab7b_support_task_atomic_candidate.sql'
      - 'app/api/vox/v1/support-task/route.ts'
      - 'scripts/mvp/vox/validate-voxAB7B-support-atomic-pg17.ps1'
      - '.github/workflows/vox-ab7b-support-atomic-hold.yml'
permissions:
  contents: read
jobs:
  offline-source-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Genuinely isolated PG17 original task / Staff F1 / nonce
        run: pwsh -NoProfile -File scripts/mvp/vox/validate-voxAB7B-support-atomic-pg17.ps1
      - name: Core VOX regression
        run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
      - run: npm run build
