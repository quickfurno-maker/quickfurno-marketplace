global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  option redispatch
  retries 3
  timeout connect 250ms
  timeout client 10s
  timeout server 10s
  timeout check 1s

frontend quickfurno_cert
  bind 127.0.0.1:8088
  default_backend quickfurno_web

backend quickfurno_web
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  default-server inter 250ms fastinter 100ms downinter 250ms fall 2 rise 2
  server qf_host_a 127.0.0.1:3211 check
  server qf_host_b 127.0.0.1:3212 check
