name: VOX-06C Protected Staging Role and Read-only Access Matrix
on:
  pull_request:
    paths:
      - 'contracts/vox/protectedStageReadOnly.mjs'
      - 'scripts/mvp/vox/run-vox06c-protected-staging.mjs'
      - 'scripts/mvp/vox/validate-vox06c-protected-stage.test.mjs'
      - '.github/workflows/vox-06c-protected-staging.yml'
permissions:
  contents: read
jobs:
  no-live-token-staging-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-vox06c-protected-stage.test.mjs
      - name: Protected staging runner must refuse to contact live Core in CI
        run: node scripts/mvp/vox/run-vox06c-protected-staging.mjs
