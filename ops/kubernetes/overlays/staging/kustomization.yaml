apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quickfurno-staging
resources:
  - ../../base
# Fail-closed staging identity is applied to every workload, not only workers.
# The cluster must inject STAGING-only secrets in this namespace. Deployment
# remains BLOCKED until an independently signed Staging-capable image is pinned.
patches:
  - path: staging-web.yaml
  - path: staging-worker.yaml
  - path: staging-transport.yaml
  - path: staging-aarohi.yaml
