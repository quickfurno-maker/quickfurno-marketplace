name: VOX TO-04K Consolidated Live Security/Auth Ready but Release HOLD
on:
  pull_request:
    paths:
      - 'contracts/vox/stagingAal2Probe.mjs'
      - 'ops/vox/certification/TO04I-LIVE-RLS-BOUNDARY.json'
      - 'scripts/mvp/vox/*to04i-rls*'
      - 'scripts/mvp/vox/*to04j-protected-aal2*'
      - 'scripts/mvp/vox/validate-to04k-boundary-and-auth.test.mjs'
      - '.github/workflows/vox-to04k-consolidated-gates.yml'
permissions:
  contents: read
jobs:
  qf-rls-department-real-auth-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-to04k-boundary-and-auth.test.mjs scripts/mvp/vox/validate-to04i-rls-boundary.test.mjs scripts/mvp/vox/validate-to04j-protected-aal2.test.mjs
      - name: Production authorization must fail for schema, migration and RLS
        shell: bash
        run: |
          for file in scripts/mvp/vox/check-to04c-schema-readiness.mjs scripts/mvp/vox/verify-to04g-migration-history.mjs scripts/mvp/vox/check-to04i-rls-boundary.mjs; do
            set +e
            node "$file" --release-check
            STATUS=$?
            set -e
            test "$STATUS" -eq 42
          done
      - name: No staging GET without external human and real synthetic credentials
        run: node scripts/mvp/vox/run-to04j-protected-aal2.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
