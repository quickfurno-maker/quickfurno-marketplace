name: VOX-04 Service Read Boundaries
on:
  pull_request:
    paths:
      - 'contracts/vox/serviceDesk.mjs'
      - 'contracts/vox/serviceDesk.d.mts'
      - 'app/api/vox/v1/desk/**'
      - 'scripts/mvp/vox/validate-vox-04-desk.mjs'
      - '.github/workflows/vox-04-service-read.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-service-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.20.2'
      - run: node scripts/mvp/vox/validate-vox-04-desk.mjs
