name: VOX TO-04J Protected Real AAL2 Stage Probe - Source Only
on:
  pull_request:
    paths:
      - 'contracts/vox/stagingAal2Probe.mjs'
      - 'scripts/mvp/vox/*to04j-protected-aal2*'
      - '.github/workflows/vox-to04j-protected-aal2.yml'
permissions:
  contents: read
jobs:
  no-live-tokens-or-stage-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-to04j-protected-aal2.test.mjs
      - name: No real token or user creation allowed in source-only CI
        run: node scripts/mvp/vox/run-to04j-protected-aal2.mjs
