# Stage remains off unless explicitly opted in; NO public ingress.
services:
  vox-web:
    profiles: ["vox-stage-disabled"]
    build:
      context: ../..
      dockerfile: apps/vox-web/Dockerfile
    restart: "no"
    ports:
      - "127.0.0.1:3107:3000"
    environment:
      NODE_ENV: production
      VOX_DEMO_PREVIEW: disabled
    mem_limit: 768m
    cpus: "0.50"
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
