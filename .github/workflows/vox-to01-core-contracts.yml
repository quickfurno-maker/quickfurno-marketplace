name: VOX TO-01 Core Contracts (Read-Only)
on:
  pull_request:
    paths:
      - "contracts/vox/teamOperations.mjs"
      - "scripts/mvp/vox/validate-to01-team-contracts.test.mjs"
      - "docs/vox/VOX-TO01-CORE-WORK-QUEUE-CONTRACT.md"
      - ".github/workflows/vox-to01-core-contracts.yml"
permissions:
  contents: read
jobs:
  isolated-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.20.2"
      - name: Pure data projection tests — no DB, provider or secrets
        run: node --test scripts/mvp/vox/validate-to01-team-contracts.test.mjs
      - name: Source syntax
        run: node --check contracts/vox/teamOperations.mjs
