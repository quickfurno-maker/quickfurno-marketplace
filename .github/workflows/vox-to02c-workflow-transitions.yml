name: VOX TO-02C Work Intent State Machine (No Execution)
on:
  pull_request:
    paths:
      - 'contracts/vox/workIntentPreparation.mjs'
      - 'scripts/mvp/vox/validate-to02c-work-intents.test.mjs'
      - '.github/workflows/vox-to02c-workflow-transitions.yml'
permissions:
  contents: read
jobs:
  pure-workflow-negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - name: Pure validated work intents (no Core/network/database writes)
        run: node --test scripts/mvp/vox/validate-to02c-work-intents.test.mjs
      - name: Syntax
        run: node --check contracts/vox/workIntentPreparation.mjs
