name: QF F5 Vendor Returning WhatsApp Login (NO DEPLOY)

on:
  pull_request:
    paths:
      - "app/api/vendor/auth/login/**"
      - "components/vendor/VendorPortal.tsx"
      - "components/vendor/VendorWhatsappLoginForm.tsx"
      - "lib/vendors/vendorReturningLoginPolicy.ts"
      - "services/returningWhatsappVendorLoginService.ts"
      - "scripts/mvp/vendor/vendor-returning-login.test.mjs"
      - "scripts/mvp/launch/smoke-vendor-returning-login.mjs"
      - "scripts/mvp/launch/verify-vendor-returning-login.py"
      - "scripts/mvp/launch/test_vendor_returning_login_scope.py"
      - "docs/launch/F5-VENDOR-RETURNING-WHATSAPP-LOGIN-20261106.md"
      - "docs/launch/f5-vendor-returning-login-manifest.json"
      - ".github/workflows/qf-f5-vendor-returning-login.yml"

permissions:
  contents: read

jobs:
  exact-returning-login-end-to-end-held:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read-only pinned checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24 pinned setup
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Pin all eight returning-login source and test files; forbid release flags
        run: python3 scripts/mvp/launch/verify-vendor-returning-login.py --repo .
      - name: Eight source security mutation tests
        run: python3 -m unittest discover -s scripts/mvp/launch -p test_vendor_returning_login_scope.py -v
      - name: Install pinned Marketplace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Nineteen WhatsApp admission, session and frontend tests
        run: node --import ./scripts/mvp/loader/register.mjs --test scripts/mvp/vendor/vendor-returning-login.test.mjs
      - name: Whole Marketplace TypeScript check
        run: npm run typecheck
      - name: Whole Marketplace optimized production build
        run: npm run build
      - name: Real compiled localhost route holds; no provider keys
        run: node scripts/mvp/launch/smoke-vendor-returning-login.mjs
      - name: Exact isolated diff, no Core, Finance or Staff paths
        run: python3 scripts/mvp/launch/verify-vendor-returning-login.py --repo . --exact-git-diff
