name: VOX-08J Governed EOD and Internal Team Chat (Release HOLD)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/eod-submissions/**'
      - 'app/api/vox/v1/eod-reviews/**'
      - 'app/api/vox/v1/staff-chat/**'
      - 'ops/vox/sql-candidates/202610160*'
      - 'ops/vox/tests/vox08j_offline_pg17_denials.sql'
      - 'scripts/mvp/vox/validate-to08j-governed-core.spec.mjs'
      - 'docs/vox/VOX-08J-*'
      - '.github/workflows/vox-to08j-eod-chat-governed.yml'
permissions:
  contents: read
jobs:
  isolated-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-vm-modules --test scripts/mvp/vox/validate-to08j-governed-core.spec.mjs
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
