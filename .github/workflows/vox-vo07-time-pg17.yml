name: VOX VO7 Immutable Task Intervals PG17 — HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'ops/vox/vo07-review-candidates/**'
      - 'scripts/mvp/vox/fixtures/vo07-task-intervals-assertions.pg17.sql'
      - 'scripts/mvp/vox/validate-vox-vo07-time-pg17.sh'
      - '.github/workflows/vox-vo07-time-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vox_disposable_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Real PG17 task attribution, expiry, nonce and ledger integrity
        run: bash scripts/mvp/vox/validate-vox-vo07-time-pg17.sh
