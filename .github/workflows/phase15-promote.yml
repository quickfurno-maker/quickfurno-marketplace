name: Phase 15 Verify and Promote

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact merged source SHA"
        required: true
        type: string
      image_ref:
        description: "Exact QuickFurno OCI digest reference (repository@sha256:...)"
        required: true
        type: string
      apply:
        description: "Request production apply after verification and environment approval"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "For apply, type PROMOTE_EXACT_DIGEST"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

concurrency:
  group: quickfurno-phase15-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify immutable promotion candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted release-control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact merged inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_REF: ${{ inputs.image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr\.io/quickfurno-maker/quickfurno-marketplace@sha256:[0-9a-f]{64}$ ]]
          git fetch --quiet origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

      - name: Login to GHCR read-only
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Verify signature, release attestation and GitHub provenance
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/$REPOSITORY/.github/workflows/scale-container-supply-chain.yml@refs/heads/main"
          ISSUER="https://token.actions.githubusercontent.com"
          TYPE="https://quickfurno.in/attestations/qf.release.phase15.v1"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE_REF" >/dev/null
          cosign verify-attestation --type "$TYPE" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE_REF" > phase15-attestation.json
          gh attestation verify "oci://$IMAGE_REF" --repo "$REPOSITORY" >/dev/null

      - name: Extract and validate signed release manifest
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.payload' phase15-attestation.json | head -n 1 | base64 -d | jq -e '.predicate' > phase15-release.json
          node scripts/scale/phase15-release.mjs validate --manifest phase15-release.json --system QUICKFURNO --promotable
          jq -e --arg sha "$SOURCE_SHA" --arg ref "$IMAGE_REF"             '.sourceSha == $sha and any(.images[]; .role == "quickfurno-runtime" and .ref == $ref)'             phase15-release.json >/dev/null
          sha256sum phase15-release.json > phase15-release.sha256

      - name: Upload verified promotion packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickfurno-phase15-promotion-${{ inputs.source_sha }}
          path: |
            phase15-release.json
            phase15-release.sha256
          if-no-files-found: error
          retention-days: 30

  apply:
    name: Human-approved blue/green apply
    if: inputs.apply == true && vars.PHASE15_PRODUCTION_CUTOVER_ENABLED == 'true'
    needs: verify
    environment: production
    runs-on: [self-hosted, Linux, X64, qf-phase15-deployer]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Enforce typed approval phrase
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PROMOTE_EXACT_DIGEST"

      - name: Download verified promotion packet
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quickfurno-phase15-promotion-${{ inputs.source_sha }}

      - name: Invoke constrained host release controller
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/qf-phase15-release
          sha256sum -c phase15-release.sha256
          sudo -n /usr/local/sbin/qf-phase15-release stage "$PWD/phase15-release.json"
          sudo -n /usr/local/sbin/qf-phase15-release promote
          sudo -n /usr/local/sbin/qf-phase15-release status
