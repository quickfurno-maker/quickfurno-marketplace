name: VOX-05C Staff Team Operations Entry and Read-only Routing
on:
  pull_request:
    paths:
      - 'apps/vox-web/app/team/page.tsx'
      - 'apps/vox-web/app/team/team.css'
      - 'apps/vox-web/scripts/validate-to05c-team-hub.mjs'
      - '.github/workflows/vox-to05c-staff-team-hub.yml'
permissions:
  contents: read
jobs:
  default-off-staff-team-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test apps/vox-web/scripts/validate-to05c-team-hub.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/vox-web
      - run: npm run typecheck
        working-directory: apps/vox-web
      - run: npm run build
        working-directory: apps/vox-web
