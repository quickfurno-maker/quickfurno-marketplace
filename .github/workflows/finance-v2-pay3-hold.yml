name: Finance V2 PAY-3 source and PostgreSQL17 release HOLD
on:
  pull_request:
    paths:
      - ".github/workflows/finance-v2-pay3-hold.yml"
      - "lib/payments/financeV2Pay3*"
      - "app/api/vox/v1/finance-history/**"
      - "apps/vox-web/app/finance/**"
      - "apps/vox-web/lib/finance.ts"
      - "app/api/webhooks/razorpay/vendor-package/route.ts"
      - "app/api/vox/v1/finance-case/**"
      - "app/api/vox/v1/finance-case-review/**"
      - "app/api/internal/finance-pay4a-canary/**"
      - "apps/vox-web/app/api/finance-case/**"
      - "apps/vox-web/app/api/finance-case-review/**"
      - "services/financeV2Scope.ts"
      - "app/api/vox/v1/finance-orders/**"
      - "apps/vox-web/app/api/finance-orders/**"
      - "lib/payments/financeV2Pay4aCase*"
      - "services/financeV2WebhookJournal.ts"
      - "services/financeV2InboxWorker.ts"
      - "lib/payments/financeV2Casework.mjs"
      - "apps/vox-web/app/components/VoxWorkspaceNav.tsx"
      - "ops/finance/sql-candidates/*finance_v2_pay3*"
      - "ops/finance/sql-candidates/*finance_v2_pay4a*"
      - "ops/finance/sql-candidates/*finance_v2_pay4b*"
      - "scripts/mvp/payments/validate-finance-v2-pay3*"
      - "scripts/mvp/payments/validate-finance-v2-pay4a*"
      - "scripts/mvp/payments/validate-finance-v2-pay4b*"
      - "scripts/mvp/payments/financePay4b*"
      - "scripts/mvp/payments/financePay4c0*"
      - "scripts/mvp/payments/financePay4c1*"
      - "scripts/mvp/payments/finance-pay4c1-*"
      - "scripts/mvp/payments/validate-finance-v2-pay4c1*"
      - "lib/payments/financePay4c1*"
      - "ops/finance/PAY4C1-*"
      - "scripts/mvp/payments/validate-finance-v2-pay4c0*"
      - "lib/payments/financePay4c0*"
      - "contracts/vox/financePay4c0*"
      - "ops/finance/PAY4C0-*"

      - "scripts/mvp/payments/audit-finance-pay4a-migration.mjs"
      - "docs/finance/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pay3-core-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Existing Razorpay source validation
        run: node scripts/mvp/payments/validate-vendor-package-razorpay.mjs
      - name: PAY1 PAY2 PAY3 focused deterministic policies
        run: node --test scripts/mvp/payments/validate-finance-v2-pay*.test.mjs
      - name: Core TS contracts
        run: npm run typecheck
      - name: Core production build, no deployment
        run: npm run build
  pay3-vox-web-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vox-web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/vox-web
      - name: VOX Web TS contracts
        run: npm run typecheck
        working-directory: apps/vox-web
      - name: VOX Web production build, no deployment
        run: npm run build
        working-directory: apps/vox-web
  pay3-offline-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Native network-isolated PostgreSQL 17 and restore rehearsal
        shell: pwsh
        run: ./scripts/mvp/payments/validate-finance-v2-pay3-pg17.ps1
