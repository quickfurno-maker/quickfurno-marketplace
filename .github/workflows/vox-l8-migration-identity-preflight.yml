name: VOX-L8 DB and Neutral Staff Source Preflight (Release HOLD)
on:
  pull_request:
    paths:
      - 'contracts/vox/l8MigrationIdentityGate.mjs'
      - 'scripts/mvp/vox/validate-voxL8-migration-identity.test.mjs'
      - 'docs/vox/VOX-L8-*'
      - '.github/workflows/vox-l8-migration-identity-preflight.yml'
permissions:
  contents: read
jobs:
  source-only-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-voxL8-migration-identity.test.mjs
