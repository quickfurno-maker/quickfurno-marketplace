name: VOX VO7 Voluntary Presence Truth and Privacy — HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'contracts/vox/virtualOfficePresence.mjs'
      - 'apps/vox-web/lib/teamPresence.ts'
      - 'apps/vox-web/app/team/presence/page.tsx'
      - 'scripts/mvp/vox/vo02-presence-projection.test.mjs'
      - 'scripts/mvp/vox/vo06-presence-snapshot.test.mjs'
      - 'scripts/mvp/vox/vo07-presence-expiry.test.mjs'
      - '.github/workflows/vox-vo07-presence-truth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-fake-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Original voluntary presence projection and expiry regression
        run: node --test scripts/mvp/vox/vo02-presence-projection.test.mjs scripts/mvp/vox/vo06-presence-snapshot.test.mjs scripts/mvp/vox/vo07-presence-expiry.test.mjs
      - name: Root pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Root TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: Web pinned dependencies
        working-directory: apps/vox-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full VOX Web tests
        working-directory: apps/vox-web
        run: npm test
      - name: Optimized Webpack build
        working-directory: apps/vox-web
        run: npm run build -- --webpack
