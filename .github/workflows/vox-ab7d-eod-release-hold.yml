name: VOX AB7D Four Ed25519 Signed EOD - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'contracts/vox/ab7OfficialEod.mjs'
      - 'scripts/mvp/vox/validate-voxAB7-official-eod.test.mjs'
      - 'contracts/vox/ab7FourSignedSourceReadiness.mjs'
      - 'scripts/mvp/vox/validate-voxAB7-four-source-sign.test.mjs'
      - '.github/workflows/vox-ab7d-eod-release-hold.yml'
permissions:
  contents: read
jobs:
  core-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
      - run: npm run build
