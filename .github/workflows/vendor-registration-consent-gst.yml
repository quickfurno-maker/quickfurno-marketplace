permissions:
  contents: read

jobs:
  signup-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked app dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Consent, GST, identity and OTP admission
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --import ./scripts/mvp/loader/register.mjs --test scripts/mvp/vendor/vendor-signup-consent-gst.test.mjs scripts/mvp/vendor/vendor-whatsapp-otp-admission.test.mjs scripts/mvp/vendor/vendor-private-otp-verification-foundation.test.mjs scripts/mvp/vendor/vendor-internal-purpose-routing.test.mjs scripts/mvp/vendor/vendor-document-approval-gate.test.mjs scripts/mvp/vendor/vendor-owner-verification-readiness-route.test.mjs scripts/mvp/vendor/vendor-signup-ownership-reconciliation.test.mjs scripts/mvp/vendor/vendor-signup-ownership-read-contract.test.mjs scripts/mvp/vendor/vendor-otp-request-coordination.test.mjs scripts/mvp/vendor/vendor-otp-evidence-read-contract.test.mjs scripts/mvp/vendor/vendor-otp-verification-service-contract.test.mjs scripts/mvp/vendor/vendor-atomic-registration-contract.test.mjs scripts/mvp/vendor/vendor-owner-signup-status-route.test.mjs scripts/mvp/vendor/vendor-owner-review-assignment-gate.test.mjs scripts/mvp/vendor/vendor-batch6-enrollment-evidence.test.mjs scripts/mvp/vendor/vendor-vox-owner-review-queue-contract.test.mjs
      - name: Strict additive migration registry
        run: node scripts/mvp/staging/validate-qf-mvp-50-2c-s2-g1.mjs
      - name: Full TypeScript contract
        run: npm run typecheck
      - name: Existing vendor approval and category governance
        run: |
          node scripts/mvp/vendor/validate-vendor-admin-first-approvals.mjs
          node scripts/mvp/vendor/validate-v3-category-approval-isolation.mjs
      - name: Private PostgreSQL 17 acceptance, synthetic, no network
        shell: bash
        run: |
          set -euo pipefail
          name=qf-vendor-private-cert
          docker run --rm -d --name "$name" --network none \
            -e POSTGRES_PASSWORD=synthetic_ci_only postgres:17-alpine >/dev/null
          trap 'docker stop "$name" >/dev/null 2>&1 || true' EXIT
          # Postgres bootstraps with a temporary server, stops it, then starts
          # the final server. A single pg_isready can race that restart.
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$name" psql -X -U postgres -d postgres -Atqc 'SELECT 1' >/dev/null 2>&1; then
              sleep 2
              if docker exec "$name" psql -X -U postgres -d postgres -Atqc 'SELECT 1' >/dev/null 2>&1; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$name"
            exit 1
          fi
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/mvp/vendor/fixtures/vendor-private-pg-bootstrap.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261104090000_vendor_registration_consent_receipt.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261104140000_vendor_private_otp_and_verification_foundation.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/mvp/vendor/vendor-private-pg-acceptance.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261104153000_vendor_atomic_pending_registration.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/mvp/vendor/vendor-atomic-pg-acceptance.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/mvp/vendor/fixtures/vendor-owner-assignment-pg-bootstrap.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261104160000_vendor_owner_review_assignment_gate.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/mvp/vendor/vendor-owner-assignment-pg-acceptance.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261104163000_vendor_private_document_intake.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/mvp/vendor/vendor-private-intake-pg-acceptance.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261104170000_vox_owner_vendor_review_queue.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < scripts/mvp/vendor/vendor-vox-owner-queue-pg-acceptance.sql
          docker exec -i "$name" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < ops/vendor/vendor-launch-readonly-preflight-20261104.sql
