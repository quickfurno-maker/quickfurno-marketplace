name: VOX VO5 Combined Team Leader Workflows - RELEASE HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'app/api/vox/v1/tl-assignments/**'
      - 'app/api/vox/v1/team-shifts/**'
      - 'contracts/vox/virtualOfficeTeamShiftRead.*'
      - 'apps/vox-web/app/team/assignments/**'
      - 'apps/vox-web/app/team/shifts/**'
      - 'apps/vox-web/lib/teamAssignments.ts'
      - 'apps/vox-web/lib/teamShifts.ts'
      - 'scripts/mvp/vox/vo05-*.test.mjs'
      - '.github/workflows/vox-vo05-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-vo5-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Root pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: VO5 integrated TL assignments, nonce, roster and reporting
        run: |
          node --test \
            scripts/mvp/vox/vo05-tl-core-route.test.mjs \
            scripts/mvp/vox/vo05-tl-checkpoint.test.mjs \
            scripts/mvp/vox/vo05-tl-ui-source.test.mjs \
            scripts/mvp/vox/vo05-team-shift-read.test.mjs \
            scripts/mvp/vox/vo05-team-shift-route.test.mjs \
            scripts/mvp/vox/vo05-team-shifts-web.test.mjs \
            scripts/mvp/vox/vo03-team-leader-delegation.test.mjs \
            scripts/mvp/vox/vo04-time-read.test.mjs
      - name: Root TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: Web pinned dependencies
        working-directory: apps/vox-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full VOX Web tests
        working-directory: apps/vox-web
        run: npm test
      - name: Optimized Webpack build
        working-directory: apps/vox-web
        run: npm run build -- --webpack
