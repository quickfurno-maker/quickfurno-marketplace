name: VOX TO-02F Fresh Independent Reviewer Proof
on:
  pull_request:
    paths:
      - 'contracts/vox/effectiveDepartments*'
      - 'services/vox/verifiedScopedStaff.ts'
      - 'scripts/mvp/vox/validate-to02f-reviewer-source.test.mjs'
      - 'scripts/mvp/vox/validate-to02e-effective-departments.test.mjs'
      - '.github/workflows/vox-to02f-reviewer-proof.yml'
permissions:
  contents: read
jobs:
  revoke-invalid-reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-to02e-effective-departments.test.mjs scripts/mvp/vox/validate-to02f-reviewer-source.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
