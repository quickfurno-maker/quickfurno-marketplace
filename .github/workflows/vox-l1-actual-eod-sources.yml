name: VOX-L1 Actual EOD Core Sources (Release HOLD)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/eod-source-status/**'
      - 'contracts/vox/actualEodSourceStatus.*'
      - 'scripts/mvp/vox/validate-voxL1-actual-source-status.test.mjs'
      - '.github/workflows/vox-l1-actual-eod-sources.yml'
permissions:
  contents: read
jobs:
  current-core-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-voxL1-actual-source-status.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test scripts/mvp/vox/*.test.mjs
