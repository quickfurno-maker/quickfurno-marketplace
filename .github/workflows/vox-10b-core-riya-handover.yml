name: VOX-10B Core Riya Handover Circuit (Release HOLD)
on:
  pull_request:
    paths:
      - 'contracts/vox/riyaHandoverCircuit.mjs'
      - 'scripts/mvp/vox/validate-vox10b-*'
      - 'docs/vox/VOX-10B-*'
      - '.github/workflows/vox-10b-core-riya-handover.yml'
permissions:
  contents: read
jobs:
  core-no-provider-handover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/*.test.mjs
