name: VOX AB7A Staff Lifecycle Candidate - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'contracts/vox/ab7StaffLifecycle.mjs'
      - 'scripts/mvp/vox/validate-voxAB7-staff-lifecycle.test.mjs'
      - 'scripts/mvp/vox/validate-voxAB7A-staff-pg17.ps1'
      - 'ops/vox/sql-candidates/20261018030000_vox_ab7a_staff_lifecycle_pending_candidate.sql'
      - '.github/workflows/vox-ab7a-staff-release-hold.yml'
permissions:
  contents: read
jobs:
  core-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
      - run: npm run build
  postgres17-offline-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Network-isolated synthetic PostgreSQL17 proof (no Supabase)
        run: pwsh -NoProfile -File scripts/mvp/vox/validate-voxAB7A-staff-pg17.ps1
