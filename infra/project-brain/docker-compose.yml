name: qf-project-brain

services:
  neo4j:
    image: neo4j:5.26.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QF_NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${QF_NEO4J_BOLT_PORT:-17687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 384m
    volumes:
      - qf_project_brain_neo4j_data:/data
      - qf_project_brain_neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  graphiti-mcp:
    build:
      context: "${GRAPHITI_SOURCE_DIR}/mcp_server"
      dockerfile: "${QF_PROJECT_BRAIN_DOCKERFILE}"
    image: quickfurno/graphiti-mcp:0.30.2-gemini-c035afb-r1
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      MODEL_NAME: "${MODEL_NAME:-gemini-3.5-flash-lite}"
      EMBEDDER_MODEL: "${EMBEDDER_MODEL:-gemini-embedding-001}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      NEO4J_DATABASE: "neo4j"
      GRAPHITI_GROUP_ID: "quickfurno-marketplace"
      SEMAPHORE_LIMIT: "1"
    volumes:
      - ./graphiti-config.yaml:/app/mcp/config/quickfurno.yaml:ro
    ports:
      - "127.0.0.1:${QF_GRAPHITI_PORT:-18000}:8000"
    command: ["python", "main.py", "--config", "/app/mcp/config/quickfurno.yaml"]

volumes:
  qf_project_brain_neo4j_data:
    name: qf_project_brain_neo4j_data
  qf_project_brain_neo4j_logs:
    name: qf_project_brain_neo4j_logs
