name: VOX-09 Team Leader Review Queue
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/staff-review-queue/**'
      - 'scripts/mvp/vox/validate-vox-09-review-queue.mjs'
      - '.github/workflows/vox-09-staff-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node scripts/mvp/vox/validate-vox-09-review-queue.mjs
