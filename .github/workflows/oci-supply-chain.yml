name: OCI Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/scale-*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish, sign and attest this exact source head
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qf-oci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/quickfurno-marketplace

jobs:
  build-certify:
    name: Build once, scan and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.config.outputs.publish }}
      source_sha: ${{ steps.identity.outputs.source_sha }}

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Resolve public build configuration
        id: config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
          PROD_SUPABASE_URL: ${{ vars.QF_NEXT_PUBLIC_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.QF_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          PUBLISH=false
          if [[ "${EVENT_NAME}" == "push" && "${REF_NAME}" == "main" ]]; then
            PUBLISH=true
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${MANUAL_PUBLISH}" == "true" ]]; then
            if [[ "${REF_NAME}" != "main" ]]; then
              echo "REFUSED: manual publish is allowed only from main" >&2
              exit 64
            fi
            PUBLISH=true
          fi

          if [[ "${PUBLISH}" == "true" ]]; then
            test -n "${PROD_SUPABASE_URL}"
            test -n "${PROD_SUPABASE_ANON_KEY}"
            BUILD_URL="${PROD_SUPABASE_URL}"
            BUILD_ANON_KEY="${PROD_SUPABASE_ANON_KEY}"
          else
            BUILD_URL="https://example.supabase.co"
            BUILD_ANON_KEY="qf-ci-public-placeholder"
          fi

          {
            echo "QF_BUILD_SUPABASE_URL=${BUILD_URL}"
            echo "QF_BUILD_SUPABASE_ANON_KEY=${BUILD_ANON_KEY}"
          } >> "$GITHUB_ENV"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Supply-chain contract
        run: node scripts/scale/validate-supply-chain-contract.mjs

      - name: Build exact QuickFurno image once
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --build-arg "GIT_SHA=${SOURCE_SHA}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=${QF_BUILD_SUPABASE_URL}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=${QF_BUILD_SUPABASE_ANON_KEY}" \
            --tag "qf-candidate:${SOURCE_SHA}" \
            .

      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qf-candidate:${{ env.SOURCE_SHA }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          version: v0.75.0

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qf-candidate:${{ env.SOURCE_SHA }}
          format: cyclonedx
          output: qf-sbom.cdx.json
          exit-code: "0"
          version: v0.75.0

      - name: Record build metadata
        shell: bash
        run: |
          set -euo pipefail
          INSPECT="$(docker image inspect "qf-candidate:${SOURCE_SHA}")"
          IMAGE_ID="$(jq -r '.[0].Id' <<< "${INSPECT}")"
          REVISION="$(jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]' <<< "${INSPECT}")"
          test "${REVISION}" = "${SOURCE_SHA}"
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg image_id "${IMAGE_ID}" \
            --arg revision "${REVISION}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{source_sha:$source_sha,image_id:$image_id,revision:$revision,workflow:$workflow,run_id:$run_id}' \
            > qf-build-metadata.json

      - name: Package the certified image artifact
        shell: bash
        run: |
          set -euo pipefail
          docker save "qf-candidate:${SOURCE_SHA}" | zstd -T0 -8 -o qf-image.tar.zst
          zstd -t qf-image.tar.zst

      - name: Upload certified build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qf-oci-${{ steps.identity.outputs.source_sha }}
          path: |
            qf-image.tar.zst
            qf-sbom.cdx.json
            qf-build-metadata.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish exact certified artifact
    needs: build-certify
    if: needs.build-certify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download certified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qf-oci-${{ needs.build-certify.outputs.source_sha }}

      - name: Load exact certified image
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.build-certify.outputs.source_sha }}
        run: |
          set -euo pipefail
          zstd -t qf-image.tar.zst
          zstd -dc qf-image.tar.zst | docker load
          INSPECT="$(docker image inspect "qf-candidate:${SOURCE_SHA}")"
          REVISION="$(jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]' <<< "${INSPECT}")"
          test "${REVISION}" = "${SOURCE_SHA}"

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push source-SHA tag and resolve immutable digest
        id: push
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.build-certify.outputs.source_sha }}
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s' "${GHCR_IMAGE}" | tr '[:upper:]' '[:lower:]')"
          REF="${IMAGE}:${SOURCE_SHA}"
          docker tag "qf-candidate:${SOURCE_SHA}" "${REF}"
          PUSH_OUTPUT="$(docker push "${REF}" 2>&1)"
          printf '%s\n' "${PUSH_OUTPUT}"
          DIGEST="$(awk '/digest: sha256:/ {print $2}' <<< "${PUSH_OUTPUT}" | tail -n1)"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "image=${IMAGE}"
            echo "digest=${DIGEST}"
            echo "ref=${IMAGE}@${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keyless-sign immutable image digest
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Attest CycloneDX SBOM
        shell: bash
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx --predicate qf-sbom.cdx.json "${IMAGE_REF}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify keyless signature
        shell: bash
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/oci-supply-chain.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity="${IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}" >/dev/null
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity="${IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}" >/dev/null

      - name: Record release metadata
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.build-certify.outputs.source_sha }}
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          SBOM_SHA256="$(sha256sum qf-sbom.cdx.json | awk '{print $1}')"
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg immutable_ref "${IMAGE}@${DIGEST}" \
            --arg sbom_sha256 "${SBOM_SHA256}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{source_sha:$source_sha,image:$image,digest:$digest,immutable_ref:$immutable_ref,sbom_sha256:$sbom_sha256,workflow:$workflow,run_id:$run_id}' \
            > qf-release-metadata.json

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qf-oci-release-${{ needs.build-certify.outputs.source_sha }}
          path: |
            qf-release-metadata.json
            qf-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
