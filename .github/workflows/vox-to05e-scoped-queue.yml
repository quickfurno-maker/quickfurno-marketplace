name: VOX-05E Scoped Queue Starvation and Exact Source Tests
on:
  pull_request:
    paths:
      - 'contracts/vox/scopedWorkCandidates.*'
      - 'app/api/vox/v1/work-queue/route.ts'
      - 'scripts/mvp/vox/validate-to05e-scoped-queue.test.mjs'
      - '.github/workflows/vox-to05e-scoped-queue.yml'
permissions:
  contents: read
jobs:
  no-cross-staff-queue-starvation:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-to05e-scoped-queue.test.mjs scripts/mvp/vox/validate-to02g-work-queue.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
