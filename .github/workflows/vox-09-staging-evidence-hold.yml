name: VOX-09 Protected Staging Release Evidence HOLD
on:
  pull_request:
    paths:
      - 'contracts/vox/protectedStageCertificationGate.mjs'
      - 'scripts/mvp/vox/validate-vox09-staging-evidence.test.mjs'
      - 'docs/vox/VOX-09-*'
      - '.github/workflows/vox-09-staging-evidence-hold.yml'
permissions:
  contents: read
jobs:
  source-only-release-denials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/*.test.mjs
