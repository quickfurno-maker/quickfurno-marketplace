name: VOX-05 Staff Review Guards
on:
  pull_request:
    paths:
      - 'supabase/migrations/*vox_v1_staff_review_workflow.sql'
      - 'scripts/mvp/vox/validate-vox-05-approval-source.mjs'
      - '.github/workflows/vox-05-staff-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node scripts/mvp/vox/validate-vox-05-approval-source.mjs
