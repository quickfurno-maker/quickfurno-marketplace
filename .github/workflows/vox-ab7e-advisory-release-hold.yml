name: VOX AB7E AOS AGNI Advisory - SOURCE RELEASE HOLD
on:
  pull_request:
    paths:
      - 'contracts/vox/ab7OperationsAdvisory.mjs'
      - 'scripts/mvp/vox/validate-voxAB7-operations-advisory.test.mjs'
      - '.github/workflows/vox-ab7e-advisory-release-hold.yml'
permissions:
  contents: read
jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
      - run: npm run build
