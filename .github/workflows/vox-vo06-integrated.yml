name: VOX VO6 Integrated Chat and Private Presence - HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'app/api/vox/v1/staff-chat/**'
      - 'app/api/vox/v1/team-presence/**'
      - 'apps/vox-web/app/team/chat/**'
      - 'apps/vox-web/app/team/presence/**'
      - 'apps/vox-web/lib/teamWorkflow.ts'
      - 'apps/vox-web/lib/teamPresence.ts'
      - 'contracts/vox/virtualOfficePresence.*'
      - 'ops/vox/vo06-review-candidates/**'
      - 'scripts/mvp/vox/vo06-*.test.mjs'
      - '.github/workflows/vox-vo06-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-core-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Root pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: VO1–VO6 exact nonce, current scope and ephemeral presence tests
        run: |
          node --test \
            scripts/mvp/vox/vo01-virtual-office-chat-checkpoint.test.mjs \
            scripts/mvp/vox/vo02-presence-projection.test.mjs \
            scripts/mvp/vox/vo06-chat-receipt.test.mjs \
            scripts/mvp/vox/vo06-presence-core-route.test.mjs \
            scripts/mvp/vox/vo06-presence-snapshot.test.mjs \
            scripts/mvp/vox/vo06-presence-manual.test.mjs \
            scripts/mvp/vox/rc33-vox-web-finance-inbox-core-http.test.mjs
      - name: Root TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: VOX Web pinned dependencies
        working-directory: apps/vox-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Entire VOX Web test suite
        working-directory: apps/vox-web
        run: npm test
      - name: Optimized Webpack build
        working-directory: apps/vox-web
        run: npm run build -- --webpack
  real-disposable-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vox_disposable_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Real PG17 neutral Staff, cross-team, RLS and signal checks
        run: bash scripts/mvp/vox/validate-vox-vo06-presence-pg17.sh
