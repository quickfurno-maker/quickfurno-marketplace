name: VOX P06 Migration Pin Source (No Deploy)
on:
  pull_request:
    paths:
      - 'supabase/migrations/*vox_p06_is_admin_active_status_hardening.sql'
      - 'supabase/staging-history/qf-post-g1-migration-ledger-20260929.json'
      - 'scripts/mvp/staging/validate-qf-mvp-50-2c-s2-g1.mjs'
      - 'scripts/mvp/vox/validate-vox-p06-pin-20261029.mjs'
      - '.github/workflows/vox-p06-pin-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-hash-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: node scripts/mvp/vox/validate-vox-p06-pin-20261029.mjs
