name: VOX-08L Scoped Staff Notification Inbox (Release HOLD)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/staff-notifications/**'
      - 'ops/vox/sql-candidates/20261016030000_vox08l*'
      - 'ops/vox/tests/vox08l*'
      - 'scripts/mvp/vox/validate-to08l*'
      - 'docs/vox/VOX-08L*'
      - '.github/workflows/vox-to08l-notification-inbox.yml'
permissions:
  contents: read
jobs:
  test-source-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-vm-modules --test scripts/mvp/vox/validate-to08l-staff-notification-core.spec.mjs
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
