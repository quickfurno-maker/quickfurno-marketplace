name: VOX-08T Gated Internal Notification Worker (Release HOLD)
on:
  pull_request:
    paths:
      - 'worker/voxInternalNotificationCycle.mjs'
      - 'scripts/mvp/vox/validate-to08t-*'
      - 'docs/vox/VOX-08T-*'
      - '.github/workflows/vox-to08t-internal-worker-cycle.yml'
permissions:
  contents: read
jobs:
  uninstalled-worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/*.test.mjs
