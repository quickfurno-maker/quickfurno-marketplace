name: VOX VO5 Verified Team Shift Reports - HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'contracts/vox/virtualOfficeTeamShiftRead.*'
      - 'app/api/vox/v1/team-shifts/**'
      - 'apps/vox-web/lib/teamShifts.ts'
      - 'apps/vox-web/app/team/shifts/**'
      - 'scripts/mvp/vox/vo05-team-shift*.test.mjs'
      - '.github/workflows/vox-vo05-team-shifts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Root pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verified-current-shift negative and Web source tests
        run: |
          node --test \
            scripts/mvp/vox/vo05-team-shift-read.test.mjs \
            scripts/mvp/vox/vo05-team-shift-route.test.mjs \
            scripts/mvp/vox/vo05-team-shifts-web.test.mjs \
            scripts/mvp/vox/vo04-time-read.test.mjs
      - name: Core TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: Install VOX Web locked dependencies
        working-directory: apps/vox-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Web regression tests
        working-directory: apps/vox-web
        run: npm test
      - name: Web production build
        working-directory: apps/vox-web
        run: npm run build -- --webpack
