name: Phase 22 Identity Auth Independence

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/qfj-phase22-identity-auth-v1.json"
      - "docs/scale/phase-22-identity-auth-provider-independence.md"
      - "docs/scale/phase22-live-auth-snapshot.json"
      - "docs/scale/phase22-auth-callsite-manifest.json"
      - "docs/scale/phase21-supabase-callsite-manifest.json"
      - "lib/identity/**"
      - "services/identityDirectoryService.ts"
      - "scripts/grant-superadmin.mjs"
      - "scripts/scale/*phase22*"
      - "supabase/migrations/20261006113720_phase22_identity_portability.sql"
      - "package.json"
      - ".github/workflows/phase22-identity-auth.yml"
  push:
    branches: [main]
    paths:
      - "contracts/qfj-phase22-identity-auth-v1.json"
      - "docs/scale/phase-22-identity-auth-provider-independence.md"
      - "docs/scale/phase22-live-auth-snapshot.json"
      - "docs/scale/phase22-auth-callsite-manifest.json"
      - "docs/scale/phase21-supabase-callsite-manifest.json"
      - "lib/identity/**"
      - "services/identityDirectoryService.ts"
      - "scripts/grant-superadmin.mjs"
      - "scripts/scale/*phase22*"
      - "supabase/migrations/20261006113720_phase22_identity_portability.sql"
      - "package.json"
      - ".github/workflows/phase22-identity-auth.yml"

permissions:
  contents: read

concurrency:
  group: phase22-identity-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-auth-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://qf_phase22:qf_phase22_ci_only@127.0.0.1:5432/qf_phase22_test
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
        env:
          POSTGRES_DB: qf_phase22_test
          POSTGRES_USER: qf_phase22
          POSTGRES_PASSWORD: qf_phase22_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qf_phase22 -d qf_phase22_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Phase 21 call-site inventory remains current
        run: npm run test:scale:phase21:manifest
      - name: Verify Phase 22 auth call-site inventory
        run: npm run test:scale:phase22:manifest
      - name: Validate Phase 22 identity and auth contract
        run: npm run test:scale:phase22:contract
      - name: Typecheck provider-neutral identity runtime
        run: npm run typecheck
      - name: Certify alternate provider and stable principal on PostgreSQL 17
        run: npm run test:scale:phase22:postgres
      - name: Revalidate Phase 21 provider-exit contract
        run: npm run test:scale:phase21:contract
      - name: Revalidate Phase 20 launch contract
        run: npm run test:scale:phase20:contract
      - name: Verify working tree clean
        run: test -z "$(git status --porcelain)"
