name: VOX TO-02D Core Department Action Bridge (Locked)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/staff-departments/**'
      - 'scripts/mvp/vox/validate-to02d-department-api.test.mjs'
      - '.github/workflows/vox-to02d-department-action-api.yml'
permissions:
  contents: read
jobs:
  guarded-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - name: Actor, idempotency, denial and action-scope guards
        run: node --test scripts/mvp/vox/validate-to02d-department-api.test.mjs
