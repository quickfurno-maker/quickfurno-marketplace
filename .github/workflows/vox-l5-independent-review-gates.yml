name: VOX-L5 Human Reviewer Cryptographic Gates (Release HOLD)
on:
  pull_request:
    paths:
      - 'contracts/vox/independentReviewerSignatures.mjs'
      - 'scripts/mvp/vox/validate-voxL5-independent-signed-review.test.mjs'
      - '.github/workflows/vox-l5-independent-review-gates.yml'
permissions:
  contents: read
jobs:
  prove-only-never-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
