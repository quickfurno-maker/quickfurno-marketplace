name: QF P4 Staging Core and VOX Signed Images (NO DEPLOY)

# A PR can run only source checks. No image publication, service mutation or release here.
on:
  pull_request:
    paths:
      - ".github/workflows/qf-p4-staging-image-pair.yml"
      - "scripts/mvp/launch/validate-staging-image-pair-workflow.mjs"
      - "scripts/mvp/launch/validate-staging-image-pair-workflow.test.mjs"
      - "docs/vox/QF-P4-STAGING-IMAGE-PAIR-SUPPLY-CHAIN-20261106.md"
  workflow_dispatch:
    inputs:
      publish_staging_pair:
        description: "Publish staging-only artifacts, never deploy"
        type: boolean
        required: true
        default: false
      typed_confirmation:
        description: "Type PUBLISH_STAGING_PAIR_ONLY"
        type: string
        required: false
        default: ""

permissions:
  contents: read
concurrency:
  group: qf-p4-staging-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test scripts/mvp/launch/validate-staging-image-pair-workflow.test.mjs
      - run: node scripts/mvp/launch/validate-staging-image-pair-workflow.mjs

  publish-staging-images:
    # The source has to be on protected main; a draft PR can NEVER publish.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_staging_pair == true &&
      inputs.typed_confirmation == 'PUBLISH_STAGING_PAIR_ONLY' &&
      vars.QF_STAGING_IMAGE_PUBLISH_APPROVED == 'true'
    needs: source-policy
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      STAGING_URL: "${{ vars.QF_STAGING_PUBLIC_SUPABASE_URL }}"
      STAGING_PUBLIC_KEY: "${{ vars.QF_STAGING_PUBLIC_SUPABASE_ANON_KEY }}"
      CORE_IMAGE: ghcr.io/quickfurno-maker/quickfurno-staging-core
      VOX_IMAGE: ghcr.io/quickfurno-maker/quickfurno-staging-vox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false

      - name: Verify exact approved Staging public build configuration and SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$STAGING_URL" = "https://uckafzuochmbvtiodmcl.supabase.co"
          test -n "$STAGING_PUBLIC_KEY"
          STAGING_ANON_KEY="$STAGING_PUBLIC_KEY" node --input-type=module -e '
            const key=process.env.STAGING_ANON_KEY;
            if(key.startsWith("sb_publishable_")&&key.length>30)process.exit(0);
            const parts=key.split(".");
            if(parts.length!==3)process.exit(78);
            try{
              const claims=JSON.parse(Buffer.from(parts[1],"base64url").toString("utf8"));
              if(claims.role!=="anon"||claims.ref!=="uckafzuochmbvtiodmcl")process.exit(78);
            }catch{process.exit(78)}
          '
          node scripts/mvp/launch/validate-staging-image-pair-workflow.mjs

      - name: Build exact matching Staging-only Core and VOX source images
        shell: bash
        run: |
          set -euo pipefail
          docker build --file Dockerfile \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$STAGING_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$STAGING_PUBLIC_KEY" \
            --tag "$CORE_IMAGE:$GITHUB_SHA" .
          docker build --file apps/vox-web/Dockerfile \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --tag "$VOX_IMAGE:$GITHUB_SHA" .
          for image in "$CORE_IMAGE:$GITHUB_SHA" "$VOX_IMAGE:$GITHUB_SHA"; do
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          done

      - name: Core vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/quickfurno-maker/quickfurno-staging-core:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: core-trivy.json
      - run: node scripts/scale/enforce-trivy-report.mjs core-trivy.json

      - name: VOX vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/quickfurno-maker/quickfurno-staging-vox:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: vox-trivy.json
      - run: node scripts/scale/enforce-trivy-report.mjs vox-trivy.json

      - name: Core SPDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/quickfurno-maker/quickfurno-staging-core:${{ github.sha }}
          scan-type: image
          format: spdx-json
          output: core-sbom.spdx.json
      - name: VOX SPDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/quickfurno-maker/quickfurno-staging-vox:${{ github.sha }}
          scan-type: image
          format: spdx-json
          output: vox-sbom.spdx.json
      - name: Enforce both complete scans and SBOMs
        shell: bash
        run: |
          set -euo pipefail
          for file in core-trivy.json vox-trivy.json core-sbom.spdx.json vox-sbom.spdx.json; do
            test -s "$file"
          done

      - name: Login to isolated Staging GHCR repositories
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish exact source SHA and independently resolve two immutable digests
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          docker push "$CORE_IMAGE:$GITHUB_SHA"
          docker push "$VOX_IMAGE:$GITHUB_SHA"
          docker pull "$CORE_IMAGE:$GITHUB_SHA"
          docker pull "$VOX_IMAGE:$GITHUB_SHA"
          CORE_REF="$(docker image inspect "$CORE_IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          VOX_REF="$(docker image inspect "$VOX_IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          [[ "$CORE_REF" =~ ^ghcr.io/quickfurno-maker/quickfurno-staging-core@sha256:[0-9a-f]{64}$ ]]
          [[ "$VOX_REF" =~ ^ghcr.io/quickfurno-maker/quickfurno-staging-vox@sha256:[0-9a-f]{64}$ ]]
          echo "core_ref=$CORE_REF" >> "$GITHUB_OUTPUT"
          echo "vox_ref=$VOX_REF" >> "$GITHUB_OUTPUT"
          echo "core_digest=${CORE_REF##*@}" >> "$GITHUB_OUTPUT"
          echo "vox_digest=${VOX_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Keyless-sign and verify both GHCR Staging digests
        env:
          CORE_REF: "${{ steps.registry.outputs.core_ref }}"
          VOX_REF: "${{ steps.registry.outputs.vox_ref }}"
        shell: bash
        run: |
          set -euo pipefail
          ISSUER="https://token.actions.githubusercontent.com"
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/qf-p4-staging-image-pair.yml@refs/heads/main"
          for ref in "$CORE_REF" "$VOX_REF"; do
            cosign sign --yes "$ref"
            cosign verify --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$ref" >/dev/null
          done

      - name: Attest exact Staging Core digest (fails closed if unsupported by plan)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/quickfurno-maker/quickfurno-staging-core
          subject-digest: "${{ steps.registry.outputs.core_digest }}"
          push-to-registry: true

      - name: Attest exact Staging VOX digest (fails closed if unsupported by plan)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/quickfurno-maker/quickfurno-staging-vox
          subject-digest: "${{ steps.registry.outputs.vox_digest }}"
          push-to-registry: true

      - name: Report signed Staging artifacts ONLY; never deploy
        env:
          CORE_REF: "${{ steps.registry.outputs.core_ref }}"
          VOX_REF: "${{ steps.registry.outputs.vox_ref }}"
        shell: bash
        run: |
          set -euo pipefail
          echo "### Staging image pair (NOT DEPLOYED)" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Core: $CORE_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "VOX: $VOX_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment approval, rollback, real Owner AAL2, and external providers remain separate gates." >> "$GITHUB_STEP_SUMMARY"
