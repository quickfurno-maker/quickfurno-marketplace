name: QF MVP 50 Quality Gate

# Repository-only gate: offline validators, typecheck and build on a GitHub-hosted
# runner. It takes no secrets and makes no staging, provider or deployment calls.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      # Durable QF-MVP-50 feature-branch glob. The previous single-branch filter
      # went stale the moment that branch merged, silently disabling push runs.
      - 'mvp/qf-mvp-50-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On a pull_request event actions/checkout defaults to refs/pull/<n>/merge,
      # a synthetic merge commit that is not the reviewed head. Pin the event head
      # SHA explicitly so the gate proves the exact code under review.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # The QF-MVP-40.10 containment guards prove a claim over a pinned historical commit
          # range. A depth-1 checkout would not contain those ancestor objects and the guards
          # would fail closed, so the full history is required.
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      # The MVP validators import .ts modules through a resolve-only hook and rely
      # on Node's native type stripping, which Node 20 does not provide.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Report Node version
        run: node --version

      - name: Install dependencies
        run: npm ci

      # QF-MVP-40 provider/template authority is what the 50.x orchestration consumes, so the
      # exact-head gate proves it too. All offline: no secrets, no Meta, no Supabase.
      - name: QF-MVP-40.4 template catalogue
        run: npm run test:mvp:40-4

      - name: QF-MVP-40.10A Meta template contract
        run: npm run test:mvp:40-10a

      - name: QF-MVP-40.10B Wave 1 readiness
        run: node scripts/mvp/communication/validate-meta-wave1-readiness.mjs

      - name: QF-MVP-40.11 inactive mapping readiness
        run: npm run test:mvp:40-11

      - name: QF-MVP-40.12-R1 business template bindings
        run: npm run test:mvp:40-12-r1

      - name: QF-MVP-50.1A validator
        run: npm run test:mvp:50-1a

      - name: QF-MVP-50.1B validator
        run: npm run test:mvp:50-1b

      - name: QF-MVP-50.1C validator
        run: npm run test:mvp:50-1c

      - name: QF-MVP-50.2A validator
        run: npm run test:mvp:50-2a

      - name: QF-MVP-50.2B validator
        run: npm run test:mvp:50-2b

      - name: QF-MVP-50.2C validator
        run: npm run test:mvp:50-2c

      - name: QF-MVP-50.2C-S2-G1 staging history governance
        run: npm run test:mvp:50-2c-s2-g1

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
