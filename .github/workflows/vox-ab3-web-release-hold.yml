name: VOX AB3 Staff Web Strict Domain Source - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'apps/vox-web/lib/ab3Domain.ts'
      - 'apps/vox-web/app/login/**'
      - 'apps/vox-web/app/mfa/**'
      - 'apps/vox-web/app/team/command-center/page.tsx'
      - 'apps/vox-web/lib/core.ts'
      - 'apps/vox-web/lib/returnTo.*'
      - 'apps/vox-web/app/acquisition/page.tsx'
      - 'apps/vox-web/app/service-desk/page.tsx'
      - 'apps/vox-web/app/vendor360/**'
      - 'apps/vox-web/app/finance/**'
      - 'apps/vox-web/scripts/validate-rc37-navigation-401.spec.mjs'
      - 'apps/vox-web/scripts/validate-rc38-refund-review-readonly.spec.mjs'
      - 'apps/vox-web/app/finance/refund-review/**'
      - 'apps/vox-web/scripts/validate-staff-session-recovery-rc35.spec.mjs'
      - 'apps/vox-web/app/team/work-queue/page.tsx'
      - 'apps/vox-web/scripts/validate-ab3-domain.mjs'
      - '.github/workflows/vox-ab3-web-release-hold.yml'
permissions:
  contents: read
jobs:
  web-source-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/vox-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/validate-ab3-domain.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify RC37 compiled Finance/CRM/Staff 401 navigation
        run: node --test scripts/validate-rc37-navigation-401.spec.mjs
      - name: Verify RC38 compiled refund review is read only
        run: node --test scripts/validate-rc38-refund-review-readonly.spec.mjs
      - name: Verify compiled Staff session recovery and safe return paths
        run: node --test scripts/validate-staff-session-recovery-rc35.spec.mjs
