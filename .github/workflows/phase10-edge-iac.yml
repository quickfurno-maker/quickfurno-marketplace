name: Phase 10 Edge IaC

on:
  pull_request:
    branches: [main]
    paths:
      - "ops/edge/cloudflare/**"
      - "ops/edge/policy/**"
      - "ops/edge/origin/**"
      - "scripts/scale/validate-edge-origin-contract.mjs"
      - ".github/workflows/phase10-edge-iac.yml"
  push:
    branches: [main]
    paths:
      - "ops/edge/cloudflare/**"
      - "ops/edge/policy/**"
      - "ops/edge/origin/**"
      - ".github/workflows/phase10-edge-iac.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-edge-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform schema + portable edge contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Terraform formatting
        run: terraform fmt -check -recursive ops/edge/cloudflare

      - name: Terraform provider initialization
        run: terraform -chdir=ops/edge/cloudflare init -backend=false -input=false

      - name: Terraform schema validation
        run: terraform -chdir=ops/edge/cloudflare validate

      - name: Phase 10 portable edge/origin contract
        run: node scripts/scale/validate-edge-origin-contract.mjs
