name: VOX AB7B Genuine Aarohi Follow-Up Atomic Source - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'ops/vox/sql-candidates/20261018050000_vox_ab7b_aarohi_task_atomic_candidate.sql'
      - 'app/api/vox/v1/aarohi-task/route.ts'
      - 'contracts/vox/aarohiTaskInput.mjs'
      - 'contracts/vox/aarohiTaskInput.d.mts'
      - 'scripts/mvp/vox/validate-voxAB7B-aarohi-atomic*'
      - '.github/workflows/vox-ab7b-aarohi-atomic-hold.yml'
permissions:
  contents: read
jobs:
  offline-aarohi-atomicity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline genuine Aarohi task + CRM event + F1 + nonce
        run: pwsh -NoProfile -File scripts/mvp/vox/validate-voxAB7B-aarohi-atomic-pg17.ps1
      - name: Core VOX regression
        run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
      - run: npm run build
