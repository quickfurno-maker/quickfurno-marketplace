name: VOX-L9 Four Source Attributable EOD (Release HOLD)
on:
  pull_request:
    paths:
      - 'contracts/vox/l9FourSourceEodEvidence.mjs'
      - 'scripts/mvp/vox/validate-voxL9-four-source-eod.test.mjs'
      - 'docs/vox/VOX-L9-FOUR-SOURCE-ATTRIBUTABLE-EOD.md'
      - '.github/workflows/vox-l9-four-source-eod-evidence.yml'
permissions:
  contents: read
jobs:
  attributable-readonly-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-voxL9-four-source-eod.test.mjs
