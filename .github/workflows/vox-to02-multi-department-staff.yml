name: VOX TO-02 Multi-department Staff (Contract Only)
on:
  pull_request:
    paths:
      - "contracts/vox/staffDepartmentPacks.mjs"
      - "scripts/mvp/vox/validate-to02-multi-department.test.mjs"
      - "docs/vox/VOX-TO02-MULTI-DEPARTMENT-STAFF.md"
      - ".github/workflows/vox-to02-multi-department-staff.yml"
permissions:
  contents: read
jobs:
  multi-pack-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.20.2"
      - name: Pure contract negative authorization suite — no credentials
        run: node --test scripts/mvp/vox/validate-to02-multi-department.test.mjs
      - name: Syntax and no generated application writes
        run: node --check contracts/vox/staffDepartmentPacks.mjs
