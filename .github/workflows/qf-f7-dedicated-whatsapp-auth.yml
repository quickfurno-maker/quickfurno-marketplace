name: QF F7 Dedicated Riya Anisha WhatsApp Auth (NO DEPLOY)

on:
  pull_request:
    paths:
      - "lib/communication/vendorWhatsappOtpTransport.ts"
      - "services/anishaWhatsappOtpDeliveryService.ts"
      - "services/supabaseSendSmsHookService.ts"
      - "services/vendorOtpEvidenceReadService.ts"
      - "app/api/vendor/onboarding/complete/route.ts"
      - "services/returningWhatsappVendorLoginService.ts"
      - "scripts/mvp/vendor/vendor-dedicated-otp-transport.test.mjs"
      - "scripts/mvp/launch/verify-whatsapp-f7-scope.py"
      - ".github/workflows/qf-f7-dedicated-whatsapp-auth.yml"
      - "supabase/migrations/20261106113825_qf_f7_dormant_riya_anisha_auth_template_catalog.sql"
      - "supabase/migrations/20261106114301_qf_f7_client_vendor_auth_copy_code_v2_inactive_bindings.sql"
      - "docs/launch/QF-F7-DEDICATED-WHATSAPP-AUTH-20261106.md"

permissions:
  contents: read

jobs:
  certify-dedicated-vendor-otp-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout proposed exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Static sender / signature / migration / no-deploy fence
        run: python3 scripts/mvp/launch/verify-whatsapp-f7-scope.py --repo .
      - name: Install frozen Marketplace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hostile OTP, Riya Anisha separation and returning vendor tests
        run: node --import ./scripts/mvp/loader/register.mjs --test scripts/mvp/vendor/vendor-dedicated-otp-transport.test.mjs scripts/mvp/vendor/vendor-whatsapp-lane-isolation.test.mjs scripts/mvp/vendor/vendor-returning-login.test.mjs
      - name: Typecheck whole Marketplace Core
        run: npm run typecheck
      - name: Full Next optimized production build
        run: npm run build
      - name: Exact F7 branch path diff check
        run: python3 scripts/mvp/launch/verify-whatsapp-f7-scope.py --repo . --exact-git-diff
