name: VOX-L6 Unified Core and Web Source Integration (Release HOLD)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/eod-source-status/**'
      - 'app/api/vox/v1/riya-client-cases/**'
      - 'app/api/internal/agni/owner-outbox-metrics/**'
      - 'contracts/vox/actualEodSourceStatus.*'
      - 'contracts/vox/verifiedClientCasePreview.*'
      - 'contracts/vox/outboxMetricsAttestation.*'
      - 'contracts/vox/independentReviewerSignatures.mjs'
      - 'ops/vox/sql-candidates/2026101604*'
      - 'ops/vox/sql-candidates/2026101605*'
      - 'apps/vox-web/**'
      - 'scripts/mvp/vox/validate-voxL6-*'
      - 'docs/vox/VOX-L6-*'
      - '.github/workflows/vox-l6-integrated-core-web-candidate.yml'
permissions:
  contents: read
jobs:
  consolidated-core-source-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: node --experimental-vm-modules --test scripts/mvp/vox/validate-voxL3-private-metrics-http.spec.mjs scripts/mvp/vox/validate-voxL6-core-eod-riya-http.spec.mjs
      - run: npm run typecheck
  consolidated-staff-web-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/vox-web
      - run: npm test
        working-directory: apps/vox-web
      - run: npm run typecheck
        working-directory: apps/vox-web
      - run: npm run build
        working-directory: apps/vox-web
