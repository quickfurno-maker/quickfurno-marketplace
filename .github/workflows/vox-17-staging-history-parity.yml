name: VOX-17 Staging Migration History Parity
on:
  pull_request:
    paths:
      - 'scripts/mvp/vox/validate-vox17-history-parity.mjs'
      - 'ops/vox/staging-history-20261014.json'
      - '.github/workflows/vox-17-staging-history-parity.yml'
      - 'docs/vox/VOX-17-STAGING-BRANCH-HISTORY.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  migration-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: '20.20.2'}
      - run: |
          node scripts/mvp/vox/validate-vox17-history-parity.mjs --self-test
          node scripts/mvp/vox/validate-vox16c-staging-evidence.mjs
