  # SCALE-P12 â€” horizontal worker and agent scaling certification.
  # Depends on the existing durable-job and matching contention proofs, then
  # certifies 32 concurrent messaging claimers with per-conversation ordering.
  phase12-horizontal-workers-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - durable-jobs-certification
      - matching-scale-certification
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: qf_phase12
          POSTGRES_PASSWORD: qf_phase12_ci_only
          POSTGRES_DB: qf_phase12
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qf_phase12 -d qf_phase12"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        run: |
          EXPECTED_SHA="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Phase 12 horizontal worker contract
        run: npm run test:scale:phase12:contract

      - name: Revalidate dedicated conversation fast path
        run: node scripts/mvp/jarvis/validate-qf-conversation-fastpath.mjs

      - name: Certify 32-replica message ordering
        env:
          DATABASE_URL: postgresql://qf_phase12:qf_phase12_ci_only@127.0.0.1:5432/qf_phase12
        run: npm run test:scale:phase12:messages

