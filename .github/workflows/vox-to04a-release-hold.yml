name: VOX TO-04A Bootstrap and Immutable Release HOLD
on:
  pull_request:
    paths:
      - 'ops/vox/certification/TO04A-HOLD.json'
      - 'docs/vox/VOX-TO04A-BOOTSTRAP-REVIEW.md'
      - 'scripts/mvp/vox/validate-to04a-bootstrap-evidence.test.mjs'
      - '.github/workflows/vox-to04a-release-hold.yml'
permissions:
  contents: read
jobs:
  no-self-review-or-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/validate-to04a-bootstrap-evidence.test.mjs
