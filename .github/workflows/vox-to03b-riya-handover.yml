name: VOX TO-03B Riya Human Handover Preparation - No Outbound
on:
  pull_request:
    paths:
      - 'contracts/vox/riyaHandoverPreparation.mjs'
      - 'scripts/mvp/vox/validate-to03b-riya-handover.test.mjs'
      - '.github/workflows/vox-to03b-riya-handover.yml'
permissions:
  contents: read
jobs:
  human-takeover-source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --check contracts/vox/riyaHandoverPreparation.mjs
      - run: node --test scripts/mvp/vox/validate-to03b-riya-handover.test.mjs
