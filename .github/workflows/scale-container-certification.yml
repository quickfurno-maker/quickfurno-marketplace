name: QuickFurno Container Certification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Validate production Compose model
        run: |
          touch /tmp/qf-container-smoke.env
          QF_IMAGE_TAG="${{ github.event.pull_request.head.sha }}" \
          QF_ENV_FILE=/tmp/qf-container-smoke.env \
          docker compose -f ops/container/compose.production.yml config --quiet

      - name: Build exact-SHA production image
        run: |
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          docker build \
            --build-arg "GIT_SHA=$EXPECTED_SHA" \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=container-smoke-public-key" \
            --tag "quickfurno:$EXPECTED_SHA" \
            .

      - name: Hardened web runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          IMAGE="quickfurno:$EXPECTED_SHA"
          NAME=qf-container-smoke
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT

          docker run -d \
            --name "$NAME" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 \
            --memory 1g \
            --cpus 1.0 \
            -e QF_RUNTIME_ROLE=web \
            -e QF_RELEASE_SHA="$EXPECTED_SHA" \
            -e NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=container-smoke-public-key \
            -p 127.0.0.1:3300:3000 \
            "$IMAGE"

          ok=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3300/livez >/tmp/live.json; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" -eq 1
          curl --fail --silent http://127.0.0.1:3300/readyz >/tmp/ready.json
          grep -q "\"revision\":\"$EXPECTED_SHA\"" /tmp/live.json
          grep -q "\"revision\":\"$EXPECTED_SHA\"" /tmp/ready.json

          test "$(docker inspect "$NAME" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker inspect "$NAME" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
          test "$(docker inspect "$NAME" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED_SHA"
          docker inspect "$NAME" --format '{{json .HostConfig.CapDrop}}' | grep -q '"ALL"'
          docker inspect "$NAME" --format '{{json .HostConfig.SecurityOpt}}' | grep -q 'no-new-privileges:true'

      - name: Worker artifacts are executable on runtime Node
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="quickfurno:${{ github.event.pull_request.head.sha }}"
          docker run --rm --entrypoint node "$IMAGE" --check dist/automation-worker.mjs
          docker run --rm --entrypoint node "$IMAGE" --check dist/conversation-transport-worker.mjs
          docker run --rm --entrypoint node "$IMAGE" --check dist/aarohi-acquisition-worker.mjs

      - name: Container startup fails closed
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="quickfurno:${{ github.event.pull_request.head.sha }}"

          set +e
          docker run --rm -e QF_RUNTIME_ROLE=web "$IMAGE" >/tmp/qf-missing-env.log 2>&1
          missing_code=$?
          docker run --rm -e QF_RUNTIME_ROLE=not-a-role "$IMAGE" >/tmp/qf-unknown-role.log 2>&1
          role_code=$?
          set -e

          cat /tmp/qf-missing-env.log
          cat /tmp/qf-unknown-role.log
          test "$missing_code" -eq 78
          test "$role_code" -eq 64
          grep -q 'REFUSED missing required env' /tmp/qf-missing-env.log
          grep -q 'REFUSED unknown runtime role' /tmp/qf-unknown-role.log
