name: VOX Scoped Staff Read Source (no deploy)
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/acquisition/**'
      - 'app/api/vox/v1/vendor360/**'
      - 'app/api/vox/v1/desk/**'
      - 'app/api/vox/v1/my-work/**'
      - 'app/api/vox/v1/studio-simulate/**'
      - 'services/vox/verifiedScopedStaff.ts'
      - 'services/vox/crmScopedReads.ts'
      - 'services/vox/overviewProjection.*'
      - 'contracts/vox/**'
      - 'scripts/mvp/vox/validate-vox-read-scoped-core-20261029.mjs'
      - '.github/workflows/vox-scoped-staff-read-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-scoped-reads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: node scripts/mvp/vox/validate-vox-read-scoped-core-20261029.mjs
