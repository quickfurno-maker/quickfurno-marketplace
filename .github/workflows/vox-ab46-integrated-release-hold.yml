name: VOX AB46 Integrated Core Web PostgreSQL - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/ab4-staff-review/**'
      - 'app/api/vox/v1/ab5-source-checkpoints/**'
      - 'contracts/vox/ab4StaffRequestGateway*'
      - 'contracts/vox/ab5InternalOutboxBatch*'
      - 'services/vox/ab5InternalOutboxWorker.ts'
      - 'ops/vox/sql-candidates/20261018010000*'
      - 'apps/vox-web/lib/ab5SourceCheckpoint.ts'
      - 'apps/vox-web/app/team/daily-report/page.tsx'
      - 'scripts/mvp/vox/validate-voxAB4-*'
      - 'scripts/mvp/vox/validate-voxAB5-*'
      - 'apps/vox-web/scripts/validate-ab5-eod-sources.mjs'
      - '.github/workflows/vox-ab46-integrated-release-hold.yml'
permissions:
  contents: read
jobs:
  core-contracts-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm run typecheck
      - run: npm run build
  independent-database-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: pwsh -NoProfile -File scripts/mvp/vox/validate-voxAB3-staff-pg17.ps1
      - run: pwsh -NoProfile -File scripts/mvp/vox/validate-voxAB3-eod-pg17.ps1
      - run: pwsh -NoProfile -File scripts/mvp/vox/validate-voxAB4-native-work-pg17.ps1
  web-safety-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/vox-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/validate-ab3-domain.mjs
      - run: node scripts/validate-ab5-eod-sources.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
