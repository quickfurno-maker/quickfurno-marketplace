name: VOX-09C Core Action Intent Approval
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/action-intents/**'
      - 'contracts/vox/operationalIntent.*'
      - 'supabase/migrations/*vox_operational_intent_review.sql'
      - 'scripts/mvp/vox/validate-vox-09c-source.mjs'
      - '.github/workflows/vox-09c-action-intents.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operational-intents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node scripts/mvp/vox/validate-vox-09c-source.mjs
