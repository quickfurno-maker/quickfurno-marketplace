name: Finance V2 PAY-3 source and PostgreSQL17 release HOLD
on:
  pull_request:
    paths:
      - ".github/workflows/finance-v2-pay3-hold.yml"
      - "lib/payments/financeV2Pay3*"
      - "app/api/vox/v1/finance-history/**"
      - "apps/vox-web/app/finance/**"
      - "apps/vox-web/lib/finance.ts"
      - "app/api/webhooks/razorpay/vendor-package/route.ts"
      - "app/api/vox/v1/finance-case/**"
      - "app/api/vox/v1/finance-case-review/**"
      - "app/api/internal/finance-pay4a-canary/**"
      - "apps/vox-web/app/api/finance-case/**"
      - "apps/vox-web/app/api/finance-case-review/**"
      - "services/financeV2Scope.ts"
      - "app/api/vox/v1/finance-orders/**"
      - "apps/vox-web/app/api/finance-orders/**"
      - "lib/payments/financeV2Pay4aCase*"
      - "services/financeV2WebhookJournal.ts"
      - "services/financeV2InboxWorker.ts"
      - "lib/payments/financeV2Casework.mjs"
      - "apps/vox-web/app/components/VoxWorkspaceNav.tsx"
      - "ops/finance/sql-candidates/*finance_v2_pay3*"
      - "ops/finance/sql-candidates/*finance_v2_pay4a*"
      - "ops/finance/sql-candidates/*finance_v2_pay4b*"
      - "scripts/mvp/payments/validate-finance-v2-pay3*"
      - "scripts/mvp/payments/validate-finance-v2-pay4a*"
      - "scripts/mvp/payments/validate-finance-v2-pay4b*"
      - "scripts/mvp/payments/financePay4b*"
      - "scripts/mvp/payments/financePay4c0*"
      - "scripts/mvp/payments/financePay4c1*"
      - "scripts/mvp/payments/financePay4c2*"
      - "scripts/mvp/payments/financePay4c3*"
      - "scripts/mvp/payments/financePay4c4*"
      - "scripts/mvp/payments/validate-finance-v2-pay4c4*"
      - "lib/payments/financePay4c4*"
      - "scripts/mvp/migration/currentMigrationTruth.mjs"
      - "scripts/scale/validate-vox-migration-reconciliation-step3b1.mjs"
      - "scripts/scale/validate-step3b2-3b3-restore-evidence.mjs"
      - "scripts/scale/validate-step3b4-internal-evidence.mjs"
      - "scripts/scale/validate-step3b5-internal-rc.mjs"
      - "scripts/scale/*step3b6*"
      - "scripts/mvp/payments/step3b6-*.test.mjs"
      - "ops/vox/certification/STEP3B6-*"
      - "ops/vox/certification/STEP3B7-*"
      - "ops/vox/certification/STEP3B8-*"
      - "ops/vox/certification/STEP3B9-*"
      - "scripts/scale/*step3b9[d-f]*"
      - "scripts/scale/*step3b9def*"
      - "docs/vox/*STEP3B9[D-F]*"
      - "docs/vox/*STEP3B10*"
      - "scripts/scale/*step3b10*"
      - "scripts/scale/*step3b11*"
      - "scripts/scale/*step3b13*"
      - "scripts/scale/*step3b14*"
      - "docs/vox/*STEP3B14*"
      - "lib/vendors/betaVendorReadinessEvidence.ts"
      - "docs/vox/*STEP3B13*"
      - "ops/vox/certification/STEP3B13*"
      - "docs/vox/*STEP3B11*"
      - "ops/vox/certification/STEP3B11*"
      - "ops/vox/sql-review/STEP3B11*"
      - "scripts/scale/*step3b9*"
      - "docs/vox/*STEP3B9*"
      - "scripts/scale/*step3b8*"
      - "docs/vox/*STEP3B8*"
      - "docs/vox/VOX-PROD-READINESS-CERTIFICATION-20261023.md"
      - "scripts/scale/*step3b7*"
      - "scripts/mvp/vox/step3b7-*"
      - "scripts/mvp/payments/step3b7-*"
      - "contracts/vox/step3b7*"
      - "lib/payments/step3b7*"
      - "scripts/scale/fixtures/step3b5-*"
      - "scripts/owner-superadmin-transition-plan*.mjs"
      - "scripts/grant-superadmin.mjs"
      - "ops/vox/certification/STEP3B5-INTERNAL-RC-20261023.json"
      - "scripts/owner-superadmin-bootstrap-preflight*.mjs"
      - "ops/vox/certification/STEP3B4-ABCD-INTERNAL-REHEARSAL-20261023.json"
      - "ops/vox/certification/STEP3B2-3B3-FRESH-RESTORE-SECURITY-EVIDENCE-20261023.json"
      - "ops/vox/certification/STEP3B1-LIVE-MIGRATION-LEDGER-20261022.json"
      - "scripts/mvp/payments/validate-finance-v2-pay4c3*"
      - "scripts/mvp/payments/finance-pay4c3-*"
      - "ops/finance/PAY4C3-*"
      - "scripts/mvp/payments/validate-finance-v2-pay4c2*"
      - "docs/finance/PAY4C2-*"
      - "scripts/mvp/payments/finance-pay4c1-*"
      - "scripts/mvp/payments/validate-finance-v2-pay4c1*"
      - "lib/payments/financePay4c1*"
      - "ops/finance/PAY4C1-*"
      - "scripts/mvp/payments/validate-finance-v2-pay4c0*"
      - "lib/payments/financePay4c0*"
      - "contracts/vox/financePay4c0*"
      - "ops/finance/PAY4C0-*"

      - "scripts/mvp/payments/audit-finance-pay4a-migration.mjs"
      - "docs/finance/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pay3-core-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Step 3B-1 read-only VOX migration ledger integrity
        run: node scripts/scale/validate-vox-migration-reconciliation-step3b1.mjs
      - name: Step 3B-2 and 3B-3 frozen offline recovery evidence (release HOLD)
        run: node scripts/scale/validate-step3b2-3b3-restore-evidence.mjs
      - name: Step 3B-4 A-D source-only rehearsal and Owner bootstrap deny-by-default QA
        run: |
          node scripts/scale/validate-step3b4-internal-evidence.mjs
          node --test scripts/owner-superadmin-bootstrap-preflight.test.mjs
      - name: Step 3B-5 internal RC, Owner transition and legacy bootstrap fail-closed checks
        run: |
          node scripts/scale/validate-step3b5-internal-rc.mjs
          node --test scripts/owner-superadmin-transition-plan.test.mjs
      - name: Step 3B-6 A-F ledger, RLS/Owner HOLD and offline payments acceptance
        run: |
          node scripts/scale/step3b6-ledger-register.mjs
          node scripts/scale/step3b6-release-bill.mjs
          node scripts/scale/validate-step3b6-source-gates.mjs
          node --test scripts/scale/step3b6-source-gates.test.mjs scripts/mvp/payments/step3b6-offline-finance.test.mjs
      - name: Step 3B-7 source policy, Staff Agent, Owner and Finance history HOLD
        run: |
          node scripts/scale/step3b7-policy-inventory-audit.mjs
          node scripts/scale/step3b7-source-manifest.mjs
          node scripts/scale/validate-step3b7-source-hold.mjs
          node --test scripts/scale/step3b7-*.test.mjs scripts/mvp/vox/step3b7-integrated-boundaries.test.mjs scripts/mvp/payments/step3b7-finance-history.test.mjs
      - name: Step 3B-8 final source approval/HOLD review package
        run: |
          node scripts/scale/step3b8-review-package.mjs
          node scripts/scale/validate-step3b8-release-hold.mjs
          node --test scripts/scale/step3b8-review-queue.test.mjs
      - name: Step 3B-9 independent DBA AppSec and Owner approval HOLD
        run: |
          node scripts/scale/step3b9-review-handoff.mjs
          node --test scripts/scale/step3b9-independent-review.test.mjs
          node scripts/scale/validate-step3b9-approval-gates.mjs
      - name: Step 3B-9D/E/F source ledgers RLS and unsigned release HOLD
        run: |
          node scripts/scale/step3b9d-ledger-reconciliation.mjs
          node scripts/scale/step3b9e-effective-rls-plan.mjs
          node scripts/scale/step3b9f-release-preflight.mjs
          node --test scripts/scale/step3b9def-release.test.mjs
          node scripts/scale/validate-step3b9def-hold.mjs
      - name: Step 3B-10 Gemini second-pass findings and Finance VOX CI guard
        run: node --test scripts/scale/step3b10-gemini-reaudit.test.mjs
      - name: Step 3B-11 source-only conflict/authorization/release HOLD gates
        run: |
          node scripts/scale/step3b11a-conflict-triage.mjs
          node --test scripts/scale/step3b11-a-b-c-source.test.mjs
      - name: Step 3B-13 isolated launch-readiness and supply HOLD source gates
        run: node --test scripts/scale/step3b13-launch-readiness.test.mjs
      - name: Step 3B-14 B-E Core launch, guarded vendor advisory and read-only web contracts
        run: |
          node --test scripts/scale/step3b14-b-e-contract.test.mjs
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/mvp/loader/register.mjs --test scripts/scale/step3b14d-vendor-readiness.test.mjs
      - name: Existing Razorpay source validation
        run: node scripts/mvp/payments/validate-vendor-package-razorpay.mjs
      - name: PAY1 PAY2 PAY3 focused deterministic policies
        run: node --test scripts/mvp/payments/validate-finance-v2-pay*.test.mjs
      - name: Core TS contracts
        run: npm run typecheck
      - name: Core production build, no deployment
        run: npm run build
  pay3-vox-web-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/vox-web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/vox-web
      - name: VOX Web regression/security suite (not a substitute for live Stage E2E)
        run: npm test
        working-directory: apps/vox-web
      - name: VOX Web TS contracts
        run: npm run typecheck
        working-directory: apps/vox-web
      - name: VOX Web production build, no deployment
        run: npm run build
        working-directory: apps/vox-web
      - name: Step 3B-13 real localhost HTTP E2E with all sensitive flags disabled
        run: node ../../scripts/scale/step3b13-vox-loopback-e2e.mjs
        working-directory: apps/vox-web
  pay3-offline-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Native network-isolated PostgreSQL 17 and restore rehearsal
        shell: pwsh
        run: ./scripts/mvp/payments/validate-finance-v2-pay3-pg17.ps1
      - name: Step 3B-14A exact-count offline PostgreSQL 17 test-data purge rehearsal
        shell: bash
        run: bash scripts/scale/step3b14a-offline-ci.sh
