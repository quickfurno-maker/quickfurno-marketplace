name: VOX VO4 Staff Workday BFF and UI - HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'apps/vox-web/app/team/workday/**'
      - 'apps/vox-web/app/api/staff-time/**'
      - 'apps/vox-web/lib/staffTime.ts'
      - 'apps/vox-web/lib/vo03PendingStaffTime.d.mts'
      - 'apps/vox-web/app/team/page.tsx'
      - 'scripts/mvp/vox/vo04-staff-workday.test.mjs'
      - '.github/workflows/vox-vo04-staff-workday.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staff-workday:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Staff Workday exact source contract and receipt recovery
        run: node --test scripts/mvp/vox/vo04-staff-workday.test.mjs scripts/mvp/vox/vo03-staff-time-recovery.test.mjs
      - name: Root TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: VOX Web test suite
        working-directory: apps/vox-web
        run: npm test
      - name: Next production build
        working-directory: apps/vox-web
        run: npm run build
