name: VOX-10B Native Studio Simulation
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/studio-simulate/**'
      - 'scripts/mvp/vox/validate-vox-10b-studio.mjs'
      - '.github/workflows/vox-10b-native-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node scripts/mvp/vox/validate-vox-10b-studio.mjs
