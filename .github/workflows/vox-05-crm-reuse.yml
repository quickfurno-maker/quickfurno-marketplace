name: VOX-05 Canonical CRM Reuse
on:
  pull_request:
    paths:
      - 'contracts/vox/crmReuse.*'
      - 'services/vox/crmScopedReads.ts'
      - 'app/api/vox/v1/acquisition/**'
      - 'app/api/vox/v1/vendor360/**'
      - 'scripts/mvp/vox/validate-vox-05-crm.mjs'
      - '.github/workflows/vox-05-crm-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reuse-constrained:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - name: Validate canonical CRM read reuse
        run: node scripts/mvp/vox/validate-vox-05-crm.mjs
