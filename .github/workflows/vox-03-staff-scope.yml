name: VOX-03 Staff Scope
on:
  pull_request:
    paths:
      - 'supabase/migrations/*vox_v1_scoped_staff_authority.sql'
      - 'contracts/vox/scopedStaff.*'
      - 'services/vox/verifiedScopedStaff.ts'
      - 'app/api/vox/v1/my-work/**'
      - 'scripts/mvp/vox/validate-vox-03-scope.mjs'
      - '.github/workflows/vox-03-staff-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-staff-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.20.2'
      - name: Validate staff scope contracts and release holds
        run: node scripts/mvp/vox/validate-vox-03-scope.mjs
