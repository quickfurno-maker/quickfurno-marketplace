name: VOX VO6 Team Chat Exact Receipt - HOLD
on:
  pull_request:
    branches:
      - feat/vox-rc6-operational-20261030
    paths:
      - 'app/api/vox/v1/staff-chat/route.ts'
      - 'apps/vox-web/lib/teamWorkflow.ts'
      - 'apps/vox-web/lib/vo01PendingTeamChat.*'
      - 'apps/vox-web/app/team/chat/ChatComposer.tsx'
      - 'scripts/mvp/vox/vo06-chat-receipt.test.mjs'
      - 'scripts/mvp/vox/vo01-virtual-office-chat-checkpoint.test.mjs'
      - '.github/workflows/vox-vo06-chat-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  team-chat-nonce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Original chat nonce and strict Core-to-Web receipt regression
        run: node --test scripts/mvp/vox/vo01-virtual-office-chat-checkpoint.test.mjs scripts/mvp/vox/vo06-chat-receipt.test.mjs
      - run: ./node_modules/.bin/tsc --noEmit
      - name: Install VOX Web pinned dependencies
        working-directory: apps/vox-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: VOX Web security tests
        working-directory: apps/vox-web
        run: npm test
      - name: Optimized VOX Web build
        working-directory: apps/vox-web
        run: npm run build -- --webpack
