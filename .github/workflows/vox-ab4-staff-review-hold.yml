name: VOX AB4 Staff Review Readiness - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'app/api/vox/v1/ab4-staff-review/**'
      - 'contracts/vox/ab4StaffRequestGateway*'
      - 'scripts/mvp/vox/validate-voxAB4-staff-review.test.mjs'
      - '.github/workflows/vox-ab4-staff-review-hold.yml'
permissions:
  contents: read
jobs:
  core-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test scripts/mvp/vox/*.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
