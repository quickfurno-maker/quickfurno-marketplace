name: Scale Container Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scale-container-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Build once and certify QuickFurno image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve and verify source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(printf '%s' "$SOURCE_SHA" | wc -c)" -eq 40
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve build-time public configuration
        id: public-config
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          PROD_URL: ${{ vars.QF_PUBLIC_SUPABASE_URL }}
          PROD_ANON: ${{ vars.QF_PUBLIC_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
            if [[ -z "$PROD_URL" || -z "$PROD_ANON" ]]; then
              echo "PUBLIC_BUILD_CONFIG_MISSING" >&2
              exit 64
            fi
            printf 'url=%s\n' "$PROD_URL" >> "$GITHUB_OUTPUT"
            printf 'anon=%s\n' "$PROD_ANON" >> "$GITHUB_OUTPUT"
          else
            printf 'url=%s\n' 'https://example.supabase.co' >> "$GITHUB_OUTPUT"
            printf 'anon=%s\n' 'phase04-public-anon-placeholder' >> "$GITHUB_OUTPUT"
          fi

      - name: Static artifact contract
        run: node scripts/scale/validate-artifact-contract.mjs

      - name: Build exact release candidate once
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SUPABASE_URL: ${{ steps.public-config.outputs.url }}
          SUPABASE_ANON: ${{ steps.public-config.outputs.anon }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg GIT_SHA="$SOURCE_SHA" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON" \
            -t "quickfurno-candidate:$SOURCE_SHA" .
          docker image inspect "quickfurno-candidate:$SOURCE_SHA" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            | grep -Fx "$SOURCE_SHA"
          docker image inspect "quickfurno-candidate:$SOURCE_SHA" --format '{{.Id}}' > image-id.txt

      - name: Produce fixable HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: quickfurno-candidate:${{ steps.source.outputs.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: json
          output: trivy-vulnerabilities.json

      - name: Enforce vulnerability policy with explicit findings
        run: node scripts/scale/enforce-trivy-report.mjs trivy-vulnerabilities.json

      - name: Generate SPDX JSON SBOM from exact image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: quickfurno-candidate:${{ steps.source.outputs.sha }}
          scan-type: image
          format: spdx-json
          output: quickfurno-sbom.spdx.json
          exit-code: "0"

      - name: Package the exact certified image
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s quickfurno-sbom.spdx.json
          docker save "quickfurno-candidate:$SOURCE_SHA" | gzip -1 > quickfurno-image.tar.gz
          sha256sum quickfurno-image.tar.gz quickfurno-sbom.spdx.json image-id.txt > candidate.sha256

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickfurno-release-${{ steps.source.outputs.sha }}
          path: |
            quickfurno-image.tar.gz
            quickfurno-sbom.spdx.json
            trivy-vulnerabilities.json
            image-id.txt
            candidate.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish and sign exact QuickFurno digest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact certified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quickfurno-release-${{ needs.certify.outputs.source_sha }}

      - name: Verify and load exact candidate
        env:
          SOURCE_SHA: ${{ needs.certify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c candidate.sha256
          gunzip -c quickfurno-image.tar.gz | docker load
          test "$(docker image inspect "quickfurno-candidate:$SOURCE_SHA" --format '{{.Id}}')" = "$(cat image-id.txt)"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push exact source-SHA tag and resolve immutable digest
        id: publish
        env:
          SOURCE_SHA: ${{ needs.certify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/quickfurno-maker/quickfurno-marketplace"
          docker tag "quickfurno-candidate:$SOURCE_SHA" "$IMAGE:$SOURCE_SHA"
          docker push "$IMAGE:$SOURCE_SHA"
          docker pull "$IMAGE:$SOURCE_SHA" >/dev/null
          REF="$(docker image inspect "$IMAGE:$SOURCE_SHA" --format '{{ index .RepoDigests 0 }}')"
          DIGEST="${REF#*@}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > published-image-ref.txt

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image digest and attach SBOM attestation
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate quickfurno-sbom.spdx.json "$IMAGE@$DIGEST"

      - name: Attach GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Verify published digest remains pullable
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .RepoDigests 0 }}')" = "$IMAGE@$DIGEST"

      - name: Upload publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quickfurno-published-${{ needs.certify.outputs.source_sha }}
          path: |
            published-image-ref.txt
            quickfurno-sbom.spdx.json
            candidate.sha256
          if-no-files-found: error
          retention-days: 30
