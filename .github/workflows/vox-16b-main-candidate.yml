name: VOX-16B one-branch main candidate
on:
  pull_request:
    paths:
      - 'docs/vox/VOX-16B-MAIN-CANDIDATE.md'
      - 'scripts/mvp/vox/validate-vox16b-candidate.mjs'
      - '.github/workflows/vox-16b-main-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '20.20.2' }
      - run: |
          node scripts/mvp/vox/validate-vox16b-candidate.mjs
          node scripts/mvp/vox/validate-vox15-staging-preflight.mjs
          node scripts/mvp/vox/validate-vox16-task-idempotency.mjs
          node scripts/mvp/vox/validate-vox-11-qa.mjs
