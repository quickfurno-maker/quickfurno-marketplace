name: VOX-16F integrated Core sibling source
on:
  pull_request:
    paths:
      - 'docs/vox/VOX-16F-CONSOLIDATED-REVIEW.md'
      - 'scripts/mvp/vox/validate-vox16f-integrated-core.mjs'
      - '.github/workflows/vox-16f-integrated-core.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-and-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: '20.20.2'}
      - run: |
          node scripts/mvp/vox/validate-vox16f-integrated-core.mjs
          node scripts/mvp/vox/validate-vox16e-task-retry.mjs
      - shell: pwsh
        run: ./scripts/mvp/vox/validate-vox16-full-seven-pg17.ps1
